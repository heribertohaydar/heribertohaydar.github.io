        "help": "Compara exclusivamente dos temporadas regulares de un jugador con datos de Baseball Savant y FanGraphs. Presenta wRC+, xBA, HardHit%, Barrel% y K%, calcula las diferencias con las unidades correctas y ofrece una interpretación prudente de los cambios, identificando los datos no disponibles y las temporadas parciales.",
        "id": "prompt-player-year-comparison-source",
        "text": "MLB: 🥷 PLAYER Año 1 vs Año 2\n\nActúa como un analista profesional de MLB especializado en Statcast y sabermetría.\n\nVoy a proporcionarte:\n\n\t•\tNombre del jugador\n\t•\tAño 1\n\t•\tAño 2\n\nTu trabajo es comparar EXCLUSIVAMENTE esas dos temporadas para ese jugador.\n\n==================================================\nEXECUTION RULE — IMPORTANT\n\nNo pidas permiso.\n\nNo expliques el proceso.\n\nNo describas cómo vas a buscar los datos.\n\nNo digas:\n\n“Necesito verificar…”\n\n“Voy a consultar…”\n\n“Necesito los datos…”\n\nEn lugar de eso:\n\nConsulta directamente las fuentes requeridas, verifica los datos y entrega únicamente el resultado final solicitado.\n\nNo inventes datos para completar una métrica.\n\n==================================================\nFUENTES OBLIGATORIAS\n\nUtiliza ÚNICAMENTE:\n\n\t1.\tBaseball Savant\n\t2.\tFanGraphs\n\nEstas son las únicas fuentes permitidas para las métricas de esta comparación.\n\nNo sustituyas estas fuentes con:\n\n\t•\tESPN\n\t•\tBaseball-Reference\n\t•\tMLB.com\n\t•\tStathead\n\t•\totras páginas\n\t•\tfragmentos de buscadores\n\t•\tpublicaciones de redes sociales\n\nSi una métrica no puede verificarse en Baseball Savant o FanGraphs:\n\nIndica:\n\n“No disponible”\n\nNo la estimes.\n\nNo la reconstruyas utilizando otra fuente.\n\n==================================================\nREGLA PRINCIPAL: COMPARAR SOLO LOS DOS AÑOS\n\nLa comparación debe utilizar exclusivamente:\n\nAño 1 → Año 2\n\nNo incluyas:\n\n\t•\tAño 3\n\t•\tcarrera completa\n\t•\tpromedios de varios años\n\t•\ttemporada anterior al Año 1\n\t•\tpromedios históricos\n\t•\ttendencias de otros años\n\nPuedes utilizar información adicional SOLO para verificar la identidad del jugador o interpretar correctamente los dos años, pero las métricas mostradas deben pertenecer exclusivamente al Año 1 y Año 2.\n\n==================================================\nIDENTIDAD DEL JUGADOR\n\nAntes de extraer datos, verifica que:\n\n\t•\tel jugador sea exactamente el solicitado;\n\t•\tel equipo corresponda a la temporada correspondiente;\n\t•\tno exista confusión con otro jugador de nombre similar.\n\nSi el jugador cambió de equipo durante el Año 2:\n\nEn:\n\nEquipo (Año 2)\n\nindica el equipo correspondiente al período de Año 2 que estés utilizando según la fuente.\n\nNo atribuyas automáticamente toda la temporada al equipo actual si los datos corresponden a otro contexto.\n\n==================================================\nREGLA CRÍTICA DE TEMPORADAS PARCIALES\n\nSi Año 2 es una temporada en curso:\n\nUtiliza únicamente los datos acumulados hasta la fecha actual disponible en la fuente.\n\nNO compares:\n\nAño 1 = temporada completa\n\ncontra\n\nAño 2 = temporada completa proyectada.\n\nLa comparación debe ser:\n\nAño 1 = temporada completa\n\nvs.\n\nAño 2 = acumulado actual.\n\nAl final indica:\n\n“Datos de Año 2: temporada en curso, acumulados hasta [fecha].”\n\nSi es posible determinar claramente la fecha de corte de los datos, inclúyela.\n\n==================================================\nREGLA DE FECHA DE CORTE\n\nLa fecha en que consultaste una página NO necesariamente es la fecha hasta la que están actualizados los datos.\n\nDistingue entre:\n\n\t•\tfecha de consulta\n\t•\tfecha de actualización de la fuente\n\t•\tfecha de corte estadístico\n\nPara Año 2 en curso, la fecha relevante es la fecha hasta la cual las estadísticas están acumuladas.\n\nNo inventes una fecha de corte.\n\nSi no puedes determinarla con seguridad:\n\n“Datos parciales de la temporada 2026.”\n\n==================================================\nREGLA DE CONSISTENCIA DE MUESTRA\n\nAntes de comparar las estadísticas, verifica que:\n\n\t•\tAño 1 corresponde a la temporada correcta;\n\t•\tAño 2 corresponde a la temporada correcta;\n\t•\tlas estadísticas pertenecen al mismo jugador;\n\t•\tlos datos corresponden al período indicado;\n\t•\tno estás utilizando datos de playoffs para una comparación de temporada regular;\n\t•\tno estás mezclando datos de temporada regular con postemporada.\n\nPor defecto:\n\nUTILIZA TEMPORADA REGULAR.\n\nNo incluyas playoffs a menos que el usuario lo solicite explícitamente.\n\n==================================================\nMÉTRICAS OBLIGATORIAS\n\nDevuelve ÚNICAMENTE estas cinco métricas:\n\n\t1.\twRC+\n\t2.\txBA\n\t3.\tHardHit%\n\t4.\tBarrel%\n\t5.\tK%\n\nNo agregues:\n\n\t•\tOPS\n\t•\tAVG\n\t•\tOBP\n\t•\tSLG\n\t•\tISO\n\t•\tWAR\n\t•\twOBA\n\t•\txSLG\n\t•\txwOBA\n\t•\texit velocity\n\t•\tchase rate\n\t•\twalk rate\n\t•\totras estadísticas\n\nAunque sean relevantes, no deben aparecer en la salida.\n\n==================================================\nREGLAS DE DEFINICIÓN Y FUENTE\n\nNo mezcles valores de distintas definiciones si las fuentes presentan variantes.\n\nUtiliza la versión estándar de cada métrica correspondiente al contexto de temporada regular.\n\nSi Baseball Savant y FanGraphs presentan una diferencia debido a definición, metodología o actualización:\n\nNO combines los valores como si fueran idénticos.\n\nPrioriza:\n\n\t•\tBaseball Savant para xBA, HardHit% y Barrel%;\n\t•\tFanGraphs para wRC+ y K%.\n\nPuedes utilizar ambas fuentes para verificar consistencia, pero no sustituyas una métrica por otra de manera arbitraria.\n\n==================================================\nREGLA DE DIFERENCIAS\n\nCalcula automáticamente:\n\nAño 2 − Año 1\n\nLa diferencia debe representar el cambio real entre las dos temporadas.\n\nEjemplo:\n\nAño 1: 120\n\nAño 2: 135\n\nDiferencia:\n\n(+15)\n\nEjemplo:\n\nAño 1: .280\n\nAño 2: .250\n\nDiferencia:\n\n(-.030)\n\n==================================================\nREGLA CRÍTICA PARA PORCENTAJES\n\nPara métricas expresadas como porcentajes:\n\nHardHit%\n\nBarrel%\n\nK%\n\nla diferencia debe expresarse en PUNTOS PORCENTUALES.\n\nEjemplo:\n\nAño 1: 40.0%\n\nAño 2: 43.5%\n\nCorrecto:\n\n(+3.5 pp)\n\nNO:\n\n(+8.75%)\n\nNo calcular el cambio relativo porcentual.\n\nLa comparación solicitada es la diferencia absoluta entre los valores.\n\n==================================================\nREGLA PARA xBA\n\nxBA se expresa como promedio de bateo esperado.\n\nEjemplo:\n\nAño 1: .275\n\nAño 2: .291\n\nDiferencia:\n\n(+.016)\n\nNo conviertas xBA a porcentaje.\n\n==================================================\nREGLA PARA wRC+\n\nwRC+ es un índice donde 100 representa el nivel promedio de liga.\n\nNo conviertas la diferencia en porcentaje relativo.\n\nEjemplo:\n\nAño 1: 125\n\nAño 2: 110\n\nDiferencia:\n\n(-15)\n\n==================================================\nREGLA DE DECIMALES\n\nConserva el número de decimales utilizado por la fuente original siempre que sea posible.\n\nNo agregues falsa precisión.\n\nEjemplos:\n\n40.2% → 43.7% = (+3.5 pp)\n\n.281 → .267 = (-.014)\n\n125 → 112 = (-13)\n\nSi la fuente muestra:\n\n.28\n\nno inventes:\n\n.280\n\nSi la fuente muestra:\n\n40.2%\n\nno cambies a:\n\n40.20%\n\n==================================================\nFORMATO EXACTO DE SALIDA\n\nNOMBRE DEL JUGADOR\n\nEquipo (Año 2)\n\n📉 wRC+\nAño 1 → Año 2 (diferencia)\n\n⚾ xBA\nAño 1 → Año 2 (diferencia)\n\n🟥 HardHit%\nAño 1 → Año 2 (diferencia)\n\n🔥 Barrel%\nAño 1 → Año 2 (diferencia)\n\n👑 K%\nAño 1 → Año 2 (diferencia)\n\nNo agregues ninguna métrica adicional.\n\n==================================================\nFORMATO DE VALORES\n\nEjemplo:\n\nJuan Pérez\n\nLos Angeles Dodgers (2026)\n\n📉 wRC+\n128 → 114 (-14)\n\n⚾ xBA\n.289 → .271 (-.018)\n\n🟥 HardHit%\n46.2% → 42.8% (-3.4 pp)\n\n🔥 Barrel%\n12.5% → 9.7% (-2.8 pp)\n\n👑 K%\n21.4% → 24.1% (+2.7 pp)\n\nEste ejemplo es SOLO de formato.\n\nNo utilices estos valores como datos reales.\n\n==================================================\nREGLA DE MÉTRICAS NO DISPONIBLES\n\nSi una métrica no está disponible para uno de los dos años:\n\nEjemplo:\n\n📉 wRC+\n128 → No disponible\n\nNo calcules la diferencia.\n\nEscribe:\n\n“Diferencia: no disponible”\n\nNo sustituyas la métrica con una estadística parecida.\n\n==================================================\nANÁLISIS FINAL\n\nDespués de las cinco métricas, escribe un análisis de:\n\n40–70 palabras.\n\nEl análisis debe explicar ÚNICAMENTE los cambios relacionados con la producción ofensiva.\n\nNo expliques qué significa cada estadística.\n\nNo hagas una biografía del jugador.\n\nNo hables de:\n\n\t•\tdefensa\n\t•\tWAR\n\t•\tsalario\n\t•\tequipo\n\t•\tplayoffs\n\t•\tliderazgo\n\t•\tpersonalidad\n\t•\tlesiones\n\nsalvo que una lesión sea estrictamente necesaria para explicar por qué la comparación de producción es parcial.\n\n==================================================\nORDEN DE INTERPRETACIÓN\n\nPrioriza la interpretación en este orden:\n\n\t1.\tBarrel%\n\t2.\tHardHit%\n\t3.\txBA\n\t4.\tK%\n\t5.\twRC+\n\nPero NO fuerces una explicación basada en este orden si los datos no la respaldan.\n\nEl análisis debe explicar el conjunto de cambios.\n\n==================================================\nCAUSALIDAD — REGLA IMPORTANTE\n\nNo afirmes que una métrica “causó” directamente el cambio en wRC+.\n\nEstas métricas ayudan a describir aspectos diferentes de la producción ofensiva.\n\nUtiliza lenguaje como:\n\n\t•\t“es consistente con”\n\t•\t“ayuda a explicar”\n\t•\t“coincide con”\n\t•\t“sugiere”\n\t•\t“el perfil ofensivo muestra”\n\nEvita:\n\n“el aumento del Barrel% causó el aumento del wRC+”\n\nsalvo que exista evidencia adicional que permita establecer causalidad.\n\n==================================================\nCÓMO INTERPRETAR EL CAMBIO\n\nSi Barrel% y HardHit% bajan:\n\nExplica que hay menor frecuencia de contacto de alta calidad.\n\nSi xBA también baja:\n\nExplica que el perfil de contacto sugiere menor calidad ofensiva esperada.\n\nSi K% aumenta:\n\nExplica que más ponches reducen las oportunidades de generar producción ofensiva.\n\nSi wRC+ también baja:\n\nExplica que el cambio general es consistente con una reducción de producción ofensiva.\n\nSi las métricas mejoran:\n\nExplica cómo el conjunto de:\n\n\t•\tmejor contacto\n\t•\tmás barrels\n\t•\tmejor xBA\n\t•\tmenor K%\n\npuede ser consistente con una mayor producción ofensiva.\n\nNo necesitas que todas las métricas se muevan en la misma dirección.\n\n==================================================\nCONTRADICCIONES ENTRE MÉTRICAS\n\nSi las métricas cuentan historias diferentes, dilo.\n\nEjemplo:\n\nSi:\n\n\t•\tBarrel% sube\n\t•\tHardHit% sube\n\t•\txBA baja\n\t•\tK% sube\n\t•\twRC+ baja\n\nNO digas simplemente:\n\n“Todo empeoró.”\n\nExplica que la calidad de contacto mostró señales positivas, pero el aumento de ponches y la caída del xBA coincidieron con una menor producción ofensiva.\n\nLa función del análisis es explicar la combinación de señales.\n\n==================================================\nNO SOBREGENERALIZAR\n\nNo conviertas cambios pequeños en grandes conclusiones.\n\nEjemplo:\n\nwRC+:\n\n125 → 122\n\nNo describas esto como:\n\n“gran caída ofensiva.”\n\nDescribe el cambio como:\n\n“ligera disminución.”\n\nDel mismo modo:\n\nK%:\n\n21.5% → 21.8%\n\nNo lo presentes como un cambio dramático.\n\nLa magnitud importa.\n\n==================================================\nREGLA DE CONTEXTO PARA TEMPORADA EN CURSO\n\nSi Año 2 está en curso y el tamaño de muestra es considerablemente menor que Año 1:\n\nEl análisis debe reconocer que Año 2 es parcial.\n\nEjemplo:\n\n“Los datos de 2026 son parciales, por lo que el cambio todavía puede variar con el resto de la temporada.”\n\nNo conviertas una temporada parcial en una conclusión definitiva sobre el jugador.\n\n==================================================\nREGLA DE EQUIPO\n\nEl encabezado debe mostrar:\n\nEquipo (Año 2)\n\nSi el jugador cambió de equipo durante Año 2, no inventes un único equipo si la fuente presenta los datos agregados de toda la temporada.\n\nEn ese caso:\n\nEquipo: “Múltiples equipos”\n\nsi corresponde.\n\nNo atribuyas automáticamente las estadísticas completas de la temporada a un solo equipo.\n\n==================================================\nFACT-CHECK F   return `<article class="prompt-card searchable" data-search="${attr([item.search,item.title,item.type].join(' '))}">
    <div class="prompt-meta"><span class="prompt-type">${esc(item.type)}</span><span class="tag">${esc(item.number || `Prompt ${String(index+1).padStart(2,'0')}`)}</span></div>
    <h3 title="${attr(item.help)}">${esc(item.title)}</h3><p class="prompt-help">${esc(item.help)}</p>
    <div class="prompt-actions"><button class="prompt-copy" data-copy-prompt="${attr(id)}" type="button">Copiar prompt completo</button></div>
    <textarea aria-label="Texto completo del prompt ${attr(item.title)}" class="prompt-copy-source" id="${attr(id)}" readonly>${esc(item.text)}</textarea>
  </article>`;
}
function renderTab(tab,index) {
  const items = MLB_CONFIG.content[tab.dataKey] || [];
  const panelId = `panel-${tab.id}`;
  const isActive = index === 0;
  let cards = '';
  if (tab.itemType === 'radio') cards = items.map(renderRadio).join('');
  else if (tab.itemType === 'prompt') cards = items.map(renderPrompt).join('');
  else cards = items.map(item => renderLink(item,tab.id)).join('');
  const containerId = tab.itemType === 'radio' ? 'radio-cards' : tab.itemType === 'prompt' ? 'resources-prompts' : `resources-${tab.id}`;
  const countId = tab.itemType === 'radio' ? 'radio-count' : `count-${tab.id}`;
  const inputId = `search-${tab.id}`;
  const emptyId = `empty-${tab.id}`;
  const gridClass = (tab.itemType === 'radio' || tab.itemType === 'prompt') ? 'cards' : 'resource-grid';
  const countText = `${items.length} ${items.length === 1 ? tab.singular : tab.plural}`;
  return `<section id="${panelId}" class="tab-panel${isActive?' active':''}" data-panel="${attr(tab.id)}" role="tabpanel" aria-labelledby="tab-${attr(tab.id)}" aria-hidden="${!isActive}" ${isActive?'':'hidden'}>
    <div class="section-head"><div><h2>${esc(tab.title)}</h2><p>${esc(tab.description)}</p></div><div class="result-count" id="${countId}">${esc(countText)}</div></div>
    <label class="search panel-search"><span>⌕</span><input type="search" id="${inputId}" autocomplete="off" placeholder="${attr(tab.searchPlaceholder)}" aria-label="${attr(tab.searchPlaceholder)}"></label>
    <div class="${gridClass}" id="${containerId}">${cards}</div>
    <div class="empty" id="${emptyId}" style="display:none">${esc(tab.empty)}</div>
  </section>`;
}
function renderNavigation() {
  const nav = document.querySelector('.nav-inner');
  nav.innerHTML = MLB_CONFIG.tabs.map((tab,index)=>`<button class="nav-tab${index===0?' active':''}" id="tab-${attr(tab.id)}" data-tab="${attr(tab.id)}" role="tab" aria-controls="panel-${attr(tab.id)}" aria-selected="${index===0}" tabindex="${index===0?0:-1}"><span>${esc(tab.number)}</span> ${esc(tab.label)}</button>`).join('');
}
function renderAll() {
  renderNavigation();
  document.getElementById('panel-container').innerHTML = MLB_CONFIG.tabs.map(renderTab).join('');
  bindAll();
}
function activateTab(name,focus=false) {
  const tabs=[...document.querySelectorAll('.nav-tab')];
  const panels=[...document.querySelectorAll('.tab-panel')];
  const selected=tabs.find(t=>t.dataset.tab===name);
  const selectedPanel=panels.find(p=>p.dataset.panel===name);
  if(!selected || !selectedPanel) return;
  tabs.forEach(t=>{const on=t===selected;t.classList.toggle('active',on);t.setAttribute('aria-selected',String(on));t.tabIndex=on?0:-1;});
  panels.forEach(p=>{const on=p===selectedPanel;p.classList.toggle('active',on);p.hidden=!on;p.setAttribute('aria-hidden',String(!on));});
  if(focus) selected.focus();
}
function filterPanel(tab) {
  const input=document.getElementById(`search-${tab.id}`);
  const panel=document.getElementById(`panel-${tab.id}`);
  if(!input || !panel) return;
  const items=[...panel.querySelectorAll('.searchable')];
  const count=panel.querySelector('.result-count');
  const empty=panel.querySelector('.empty');
  const base=MLB_CONFIG.content[tab.dataKey] || [];
  const singular=tab.singular,plural=tab.plural;
  const apply=()=>{
    const q=input.value.trim().toLocaleLowerCase('es');let visible=0;
    items.forEach(item=>{
      const text=((item.dataset.search||'')+' '+item.innerText).toLocaleLowerCase('es');
      const show=!q || text.includes(q);item.style.display=show?'':'none';if(show)visible++;
    });
    if(count) count.textContent=`${visible} ${visible===1?singular:plural}`;
    if(empty) empty.style.display=visible?'none':'block';
  };
  input.addEventListener('input',apply);apply();
}
function bindAll() {
  const tabs=[...document.querySelectorAll('.nav-tab')];
  tabs.forEach((tab,index)=>{
    tab.addEventListener('click',()=>activateTab(tab.dataset.tab));
    tab.addEventListener('keydown',e=>{
      if(!['ArrowRight','ArrowLeft','Home','End'].includes(e.key)) return;
      e.preventDefault();let next=index;
      if(e.key==='ArrowRight') next=(index+1)%tabs.length;
      if(e.key==='ArrowLeft') next=(index-1+tabs.length)%tabs.length;
      if(e.key==='Home') next=0;if(e.key==='End') next=tabs.length-1;
      activateTab(tabs[next].dataset.tab,true);
    });
  });
  MLB_CONFIG.tabs.forEach(filterPanel);
  document.querySelectorAll('.prompt-copy').forEach(button=>button.addEventListener('click',async()=>{
    const source=document.getElementById(button.dataset.copyPrompt);if(!source)return;
    const text=source.value,old=button.textContent;
    try{
      if(navigator.clipboard&&window.isSecureContext) await navigator.clipboard.writeText(text);
      else {source.focus();source.select();source.setSelectionRange(0,source.value.length);if(!document.execCommand('copy'))throw new Error('copy failed');}
      button.textContent='Copiado';
    }catch(e){window.prompt('Copia el prompt completo:',text);}
    setTimeout(()=>button.textContent=old,1500);
  }));
  document.querySelectorAll('.copy').forEach(button=>button.addEventListener('click',async()=>{
    const url=button.dataset.url,old=button.textContent;
    try{await navigator.clipboard.writeText(url);button.textContent='Copiado';setTimeout(()=>button.textContent=old,1300);}
    catch(e){window.prompt('Copia este enlace:',url);}
  }));
  document.querySelectorAll('.team-logo-img').forEach(img=>img.addEventListener('error',()=>{
    img.hidden=true;const fallback=img.nextElementSibling;if(fallback)fallback.hidden=false;
  },{once:true}));
}
renderAll();
</script>
</body>
</html>
