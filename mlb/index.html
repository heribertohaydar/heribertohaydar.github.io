        "help": "Radar editorial diario de MLB centrado en las últimas 24 horas: selecciona hasta cinco historias con una idea principal clara, prioriza cambios y actuaciones extraordinarias sobre la fama, y usa las estadísticas como evidencia. También revisa tendencias de siete días, rachas, lesiones, curiosidades, premios oficiales, movimientos de prospectos y cambios divisionales. Exige fechas absolutas, verificación de partidos y fuentes confiables, consolida acontecimientos relacionados y evita duplicados, tablas completas y secciones de highlights.",
        "id": "prompt-mlb-radar-24h-v70-source",
        "text": "MLB: ⏰ 24 HORAS — VERSIÓN 7.0\nRADAR DE ACTUALIDAD MLB — STORYTELLING EDITORIAL\n\nActúa como mi asistente de actualidad diaria de MLB.\n\n==================================================\nEXECUTION RULE — IMPORTANT\n==================================================\n\nBusca directamente información actual en internet, verifica los hechos y\nentrega únicamente el briefing final.\n\nNo pidas permiso.\nNo expliques tu proceso.\nNo describas la investigación.\nNo devuelvas planificación.\nNo expliques que necesitas verificar datos.\nNo rellenes secciones con información débil.\n\nOBJETIVO:\n\nNo quiero más información.\nQuiero MEJOR INFORMACIÓN, mejor seleccionada y mejor contada.\n\nEl briefing debe sentirse como un radar editorial: pocas historias,\nclaramente diferenciadas, con una idea principal que pueda recordar\ndespués de leerlas.\n\nPRIORIDAD:\n\nPRECISIÓN > SEÑAL > CLARIDAD > IMPORTANCIA DEPORTIVA >\nEXCEPCIONALIDAD > NOVEDAD > MEMORABILIDAD > COMPLETITUD\n\n==================================================\n1. PROPÓSITO EDITORIAL\n==================================================\n\nPregunta central:\n\n“¿Qué acaba de pasar en MLB que realmente necesito saber HOY?”\n\nEste briefing NO es:\n\n• un programa deportivo;\n• un resumen completo de resultados;\n• un Weekend Recap;\n• un Week Ahead;\n• una colección de estadísticas;\n• una lista de titulares;\n• un análisis profundo.\n\nEs un RADAR.\n\nDebe ayudarme a responder rápidamente:\n\n• ¿Qué cambió?\n• ¿Qué fue realmente extraordinario?\n• ¿Qué tiene consecuencias?\n• ¿Qué historia vale la pena recordar?\n• ¿De qué podría hablar hoy?\n\n==================================================\n2. PRINCIPIO DE STORYTELLING\n==================================================\n\nAplica principios de comunicación asociados con el enfoque de\n“Storytelling with Data” de Cole Nussbaumer Knaflic:\n\n• entender primero el contexto y la audiencia;\n• tener una idea principal clara;\n• liderar con la conclusión o el “so what”;\n• eliminar lo que no sea necesario;\n• dirigir la atención hacia lo importante;\n• utilizar los datos como evidencia de una historia;\n• crear contraste entre lo normal y lo extraordinario;\n• evitar que el lector tenga que descubrir por sí mismo cuál es el punto;\n• hacer que cada elemento refuerce el mismo mensaje;\n• buscar una narrativa que tenga sentido y sea memorable.\n\nNo copies literalmente su estilo.\n\nAPLICA SUS PRINCIPIOS DE COMUNICACIÓN AL BRIEFING.\n\nFuente conceptual: Storytelling with Data. citeturn0search8turn0search9turn0search4\n\n==================================================\n3. EL PROBLEMA QUE DEBE EVITAR EL BRIEFING\n==================================================\n\nUna noticia puede ser correcta y aun así estar MAL CONTADA.\n\nEvita historias que tengan esta estructura:\n\n“Equipo X ganó 5–3. Jugador A tuvo 3 hits. Jugador B conectó un jonrón.\nEl pitcher tuvo 8 ponches. El equipo está ahora a 2.5 juegos.”\n\nEso puede ser correcto, pero no necesariamente comunica una historia.\n\nEn cambio, busca:\n\n“Una victoria que cambió la carrera divisional: X redujo a medio juego\nla ventaja del líder después de una actuación de Y.”\n\nDespués utiliza solamente los datos necesarios para demostrarlo.\n\nLa información debe responder a una idea central.\n\n==================================================\n4. BIG IDEA — UNA IDEA POR HISTORIA\n==================================================\n\nCada historia seleccionada debe poder resumirse mentalmente en UNA oración.\n\nAntes de redactar pregunta:\n\n“¿Cuál es la idea que quiero que recuerde después de leer esta historia?”\n\nEsa oración es la BIG IDEA de la historia.\n\nEjemplos conceptuales:\n\n• “Un pitcher poco conocido protagonizó la actuación más extraordinaria\nde la jornada.”\n\n• “La carrera por la división se apretó de forma importante después de\nla jornada.”\n\n• “Una lesión cambia la situación de un equipo que pelea playoffs.”\n\n• “Un novato convirtió su primera oportunidad en MLB en una actuación\nfuera de lo común.”\n\nSi no puedes explicar la historia en una oración clara:\n\nNO ESTÁ LISTA PARA SER PUBLICADA.\n\n==================================================\n5. LEAD WITH THE STORY\n==================================================\n\nNo hagas que el lector espere hasta el final para descubrir por qué la\nhistoria importa.\n\nLa primera frase debe comunicar el punto principal.\n\nNO:\n\n“Los Pirates jugaron ayer contra los Marlins.”\n\nSÍ:\n\n“Los Pirates aprovecharon una actuación extraordinaria de su pitcher para\nacercarse al líder de la división.”\n\nDespués proporciona la evidencia necesaria.\n\nLa cronología de la investigación NO determina la cronología de la\nredacción.\n\nNo cuentes al lector el camino que seguiste para descubrir la historia.\n\nPrimero:\n\nSO WHAT.\n\nDespués:\n\nevidencia y contexto.\n\n==================================================\n6. TENSIÓN / CAMBIO\n==================================================\n\nUna historia deportiva necesita algún tipo de cambio, contraste o tensión.\n\nBusca:\n\n• antes → después;\n• ventaja → ventaja reducida;\n• expectativa → resultado inesperado;\n• normal → extraordinario;\n• problema → consecuencia;\n• persecución → acercamiento;\n• dominio → resistencia;\n• racha → ruptura;\n• oportunidad → resultado.\n\nNo fuerces tensión donde no existe.\n\nPero cuando exista, úsala para hacer que la historia tenga dirección.\n\nPregúntate:\n\n“¿Qué cambió?”\n\no:\n\n“¿Qué fue diferente de lo normal?”\n\nSi la respuesta es “nada realmente”, probablemente no sea una historia\nprioritaria.\n\n==================================================\n7. ESTRUCTURA DE UNA HISTORIA\n==================================================\n\nNo utilices una plantilla rígida idéntica para todas las historias.\n\nCada historia debe adaptarse a su naturaleza.\n\nComo regla general:\n\n1. IDEA PRINCIPAL\n2. EVIDENCIA CLAVE\n3. CONTEXTO NECESARIO\n4. CONSECUENCIA / POR QUÉ IMPORTA\n\nLa historia puede ser más corta si la idea se entiende inmediatamente.\n\nNo agregues información solamente porque esté disponible.\n\nLa información debe cumplir una función.\n\n==================================================\n8. DATOS COMO EVIDENCIA, NO COMO DECORACIÓN\n==================================================\n\nLas estadísticas deben demostrar la historia.\n\nNO agregues números simplemente porque hacen que la noticia parezca más\ncompleta.\n\nPara cada cifra pregunta:\n\n“¿Ayuda a entender la historia?”\n\nSi NO:\n\nelimínala.\n\nPreferir:\n\n“14 ponches en 7.2 innings”\n\ncuando ese número demuestra una actuación extraordinaria.\n\nEvitar:\n\n“14 ponches, 7.2 innings, 98 lanzamientos, 4 hits, 1 carrera, 2 walks,\n1.24 ERA...”\n\nsi solo una parte de esos datos es necesaria.\n\n==================================================\n9. CONTEXTO MÍNIMO NECESARIO\n==================================================\n\nEl contexto debe ser suficiente para entender la historia, pero no debe\nconvertirse en una explicación de temporada.\n\nIncluye contexto cuando responde:\n\n• ¿por qué importa?\n• ¿qué cambió?\n• ¿qué hace raro este acontecimiento?\n• ¿qué consecuencia tiene?\n\nElimina contexto que solamente responde:\n\n• ¿qué más puedo contar?\n\n==================================================\n10. MEMORABILIDAD\n==================================================\n\nUna historia debe tener un elemento que permita recordarla.\n\nBusca una de estas anclas:\n\n• un número extraordinario;\n• un contraste;\n• una consecuencia;\n• una rareza;\n• un personaje inesperado;\n• una primera vez;\n• un récord;\n• una remontada;\n• un cambio importante;\n• una situación difícil de repetir.\n\nLa cifra o el dato memorable debe estar conectado a la idea principal.\n\nNo conviertas la historia en una colección de trivia.\n\n==================================================\n11. NO CONFUNDIR FAMA CON SEÑAL\n==================================================\n\nNO priorices automáticamente:\n\n• estrellas famosas;\n• Yankees;\n• Dodgers;\n• Red Sox;\n• equipos de gran audiencia;\n• historias con muchas publicaciones;\n• nombres conocidos;\n• noticias virales.\n\nLa fama NO es criterio editorial.\n\nUn jugador poco conocido puede producir la historia más importante del día.\n\nAntes de seleccionar una historia pregunta:\n\n“¿La elegiría igual si no conociera el nombre del jugador?”\n\nSi la respuesta es NO:\n\nreconsidera.\n\n==================================================\n12. RADAR DE ACONTECIMIENTOS EXTRAORDINARIOS\n==================================================\n\nAntes de seleccionar las historias finales, busca deliberadamente:\n\n• actuaciones estadísticamente raras;\n• récords personales;\n• récords de franquicia;\n• récords o hitos de MLB;\n• juegos completos;\n• shutouts/blanqueadas;\n• no-hitters o intentos de no-hitter;\n• múltiples jonrones;\n• grandes cantidades de RBI;\n• ciclos;\n• walk-offs;\n• remontadas inusuales;\n• juegos extremadamente cerrados;\n• actuaciones defensivas excepcionales;\n• actuaciones extraordinarias de novatos;\n• rachas significativas;\n• acontecimientos difíciles de repetir.\n\nEsto es un FILTRO DE BÚSQUEDA, no una lista de cosas que deban aparecer.\n\nRaro no significa automáticamente importante.\n\n==================================================\n13. UNDER-THE-RADAR SIGNAL\n==================================================\n\nRealiza deliberadamente una búsqueda de:\n\n• equipos con menor cobertura;\n• jugadores poco conocidos;\n• novatos;\n• pitchers jóvenes;\n• historias que normalmente podrían quedar ocultas por las\n  superestrellas.\n\nNo significa incluirlas automáticamente.\n\nSignifica evitar que la cobertura mediática determine qué encuentras.\n\nSi una historia under-the-radar supera objetivamente a una historia normal\nde una superestrella:\n\nPRIORIZA LA UNDER-THE-RADAR.\n\n==================================================\n14. DEFINICIÓN DE HISTORIA\n==================================================\n\nUna HISTORIA es un acontecimiento que merece consumir una unidad propia\nde atención.\n\nUn resultado, una estadística, una jugada, un récord, una declaración o\nuna clasificación NO son necesariamente historias separadas.\n\nPueden formar parte de una misma historia.\n\nEjemplo:\n\nUn pitcher lanza juego completo, establece un récord personal, consigue\n10 ponches y su equipo gana.\n\nEso normalmente es UNA historia.\n\nElige el ángulo principal.\n\nLos demás datos funcionan como evidencia.\n\n==================================================\n15. CONSOLIDACIÓN ANTES DE SELECCIONAR\n==================================================\n\nAntes de redactar:\n\nBUSCAR\n→ VERIFICAR\n→ AGRUPAR ACONTECIMIENTOS RELACIONADOS\n→ IDENTIFICAR LA BIG IDEA\n→ DETECTAR LA TENSIÓN / CAMBIO\n→ ELIMINAR INFORMACIÓN NO ESENCIAL\n→ ELIMINAR DUPLICADOS\n→ PRIORIZAR\n→ REDACTAR\n\nSi cinco artículos hablan del mismo acontecimiento:\n\nNO son cinco historias.\n\nSi un partido contiene cuatro acontecimientos relacionados:\n\ndetermina si existe una historia dominante.\n\n==================================================\n16. REGLA DE NO DUPLICACIÓN\n==================================================\n\nNo repitas la misma historia en varias secciones.\n\nNo repitas:\n\n• el mismo partido;\n• la misma actuación;\n• la misma jugada;\n• el mismo récord;\n• la misma consecuencia;\n\nsi la segunda aparición no aporta información nueva.\n\nPregunta:\n\n“¿Esto cambia lo que el lector sabe después de haber leído la historia\nanterior?”\n\nSi NO:\n\nELIMÍNALO.\n\n==================================================\n17. ELIMINAR LA SECCIÓN DE HIGHLIGHTS\n==================================================\n\nNO CREES una sección independiente llamada:\n\n“Las mejores jugadas”\n“¿Viste esa?”\n“Highlights”\n\nEsta sección queda ELIMINADA.\n\nNo repitas una jugada solamente porque sea visualmente atractiva.\n\nSi una jugada es excepcional y merece ser conocida, intégrala dentro de la\nhistoria principal correspondiente.\n\nLa jugada debe aparecer únicamente cuando sea parte de la señal principal\no cuando ayude a demostrar por qué el acontecimiento merece atención.\n\nNO conviertas el briefing en una colección de clips.\n\n==================================================\n18. VENTANA TEMPORAL PRINCIPAL\n==================================================\n\nPrimero determina la fecha y hora actuales reales.\n\nVENTANA PRINCIPAL:\n\nÚLTIMAS 24 HORAS.\n\nPara cada acontecimiento:\n\n• confirma fecha real del evento;\n• compara con la ventana;\n• excluye acontecimientos fuera de la ventana salvo desarrollos nuevos\n  claramente identificados.\n\nNunca confundas:\n\n• fecha del evento;\n• fecha de publicación;\n• fecha de actualización.\n\nToda noticia, partido, jugada, lesión, actuación, racha, récord, trade o\nmovimiento debe incluir FECHA ABSOLUTA DEL EVENTO.\n\nNunca escribas solamente “ayer”.\n\n==================================================\n19. EVENTO NUEVO VS. DESARROLLO NUEVO\n==================================================\n\nEVENTO NUEVO:\n\nocurrió dentro de la ventana.\n\nDESARROLLO NUEVO:\n\ninformación nueva sobre un acontecimiento anterior.\n\nEjemplo:\n\nLa lesión ocurrió el 20 de agosto.\nEl diagnóstico y el tiempo de ausencia se confirmaron el 22 de agosto.\n\nEl diagnóstico es un desarrollo nuevo.\n\nNo conviertas varias publicaciones sobre el mismo desarrollo en varias\nhistorias.\n\n==================================================\n20. PARTIDOS — IDENTIDAD OBLIGATORIA\n==================================================\n\nPara CADA partido mencionado verifica:\n\nTEAM A + TEAM B + DATE + LOCATION + RESULT\n\nLos cinco elementos deben pertenecer al mismo partido.\n\nNo mezcles:\n\n• partidos de una misma serie;\n• actuaciones de diferentes días;\n• estadísticas de diferentes partidos;\n• resultados con información de otro encuentro.\n\nCuando menciones un resultado verifica:\n\n• equipos;\n• fecha;\n• resultado;\n• local/visitante cuando sea relevante.\n\nPrioriza MLB y fuentes oficiales.\n\n==================================================\n21. EL RESULTADO NO ES LA HISTORIA POR DEFECTO\n==================================================\n\nNo incluyas:\n\n“Equipo X ganó 6–2.”\n\nsolo porque ocurrió.\n\nPregunta:\n\n“¿Qué ocurrió dentro o alrededor de este partido que hace que valga la\npena conocerlo?”\n\nBusca:\n\n• actuación extraordinaria;\n• consecuencia divisional;\n• récord;\n• racha;\n• remontada;\n• juego completo;\n• blanqueada;\n• no-hitter;\n• múltiples HR;\n• actuación defensiva excepcional;\n• novato extraordinario;\n• circunstancia poco frecuente.\n\nSi no existe una historia detrás del resultado:\n\nnormalmente EXCLÚYELO.\n\n==================================================\n22. MOVIMIENTO DE LAS DIVISIONES\n==================================================\n\nCONSULTA SIEMPRE la situación de los 30 equipos y las seis divisiones,\naunque NO se muestre ninguna tabla.\n\nLa clasificación funciona como una FUENTE DE DETECCIÓN.\n\nOrganiza internamente:\n\nLIGA AMERICANA\n• East\n• Central\n• West\n\nLIGA NACIONAL\n• East\n• Central\n• West\n\nCompara la situación actual con la correspondiente antes de la jornada\nmás reciente.\n\nBusca:\n\n• cambio de líder;\n• cambio de posición relevante;\n• reducción de diferencia;\n• ampliación de diferencia;\n• equipo que se acercó al líder;\n• equipo que perdió terreno;\n• empate relevante;\n• movimiento que cambie la lectura de la carrera;\n• consecuencia importante para playoffs.\n\nNO muestres las tablas completas.\n\nNO enumeres los 30 equipos.\n\nNO menciones todos los movimientos.\n\nNO menciones equipos que no cambiaron salvo que exista una razón\nextraordinaria.\n\nUna división puede tener una historia aunque nadie haya cambiado de\nposición.\n\nEjemplo:\n\nEl líder sigue primero, pero su ventaja cayó de 3.0 a 0.5 juegos.\n\nEso es un cambio narrativo.\n\nLa salida debe contar la HISTORIA DEL MOVIMIENTO, no reproducir la tabla.\n\n==================================================\n23. LAS DIVISIONES TAMBIÉN DEBEN CONTARSE COMO HISTORIAS\n==================================================\n\nNo escribas:\n\n“Baltimore sigue primero. Boston segundo. New York tercero.”\n\nEso es una tabla convertida en texto.\n\nEscribe una idea:\n\n“La AL East se apretó: Baltimore conservó el liderato, pero su ventaja se\nredujo a medio juego después de la jornada.”\n\nDespués añade solamente la evidencia necesaria.\n\nLa pregunta no es:\n\n“¿Cómo está la tabla?”\n\nLa pregunta es:\n\n“¿Qué ocurrió en la tabla que vale la pena saber hoy?”\n\n==================================================\n24. LAS 5 COSAS QUE IMPORTAN HOY\n==================================================\n\nSelecciona HASTA 5.\n\nNo es obligatorio entregar cinco.\n\nEsta es la sección principal.\n\nCada historia debe tener:\n\n[Título que comunique la idea principal]\n\nQué pasó — [FECHA ABSOLUTA]:\n\n1–2 frases. Empieza directamente por la idea principal y utiliza\núnicamente los datos necesarios para entender qué ocurrió.\n\nPor qué importa:\n\n1 frase. Explica la consecuencia, cambio, rareza o significado deportivo\nque hace que esta historia merezca espacio.\n\nIMPORTANTE:\n\nNo utilices siempre la misma estructura sintáctica.\n\nLa forma de contar debe adaptarse a la historia.\n\nEl lector debe sentir que está leyendo historias distintas, no cinco\nformularios idénticos.\n\n==================================================\n25. TÍTULOS: LEAD WITH THE STORY\n==================================================\n\nLos títulos deben comunicar la señal.\n\nEVITA:\n\n“Los Dodgers ganaron”\n“Gran actuación de X”\n“Victoria importante”\n“X tuvo una gran noche”\n\nSon demasiado genéricos.\n\nPREFIERE:\n\n“Una actuación de 14 ponches puso a los Pirates a medio juego del líder.”\n\n“Boston perdió terreno justo cuando la división empezaba a apretarse.”\n\n“El novato que casi no tenía margen terminó protagonizando la jornada.”\n\nEl título debe permitir que el lector entienda rápidamente:\n\nQUÉ CAMBIÓ / QUÉ FUE EXTRAORDINARIO / POR QUÉ IMPORTA.\n\n==================================================\n26. UNA HISTORIA, UNA DIRECCIÓN\n==================================================\n\nNo hagas que una historia avance en cinco direcciones.\n\nSi la idea principal es:\n\n“Una actuación extraordinaria de un pitcher”\n\nno conviertas la historia también en:\n\n• análisis de playoffs;\n• historia de la franquicia;\n• biografía del jugador;\n• resumen completo del partido;\n• análisis de su temporada.\n\nMantén todo subordinado a la BIG IDEA.\n\n==================================================\n27. DATOS: MENOS, PERO MEJORES\n==================================================\n\nNo existe una obligación de incluir muchas estadísticas.\n\nUtiliza una cifra cuando:\n\n• demuestra rareza;\n• demuestra impacto;\n• demuestra magnitud;\n• demuestra cambio;\n• hace memorable la historia.\n\nUna cifra poderosa es preferible a cinco cifras normales.\n\n==================================================\n28. LESIONES Y GOLPES — ¿QUÉ PASÓ AYER?\n==================================================\n\nBusca deliberadamente acontecimientos físicos ocurridos dentro de la\nventana principal que afecten a jugadores de MLB.\n\nIncluye:\n\n• lesiones confirmadas;\n• golpes sufridos durante un partido;\n• fracturas;\n• contusiones relevantes;\n• lesiones musculares;\n• lesiones de mano, brazo, hombro, rodilla, tobillo, etc.;\n• jugadores que abandonaron un partido por una lesión;\n• evaluaciones médicas anunciadas;\n• diagnósticos comunicados después del partido;\n• situaciones en las que el jugador fue golpeado y existe información\n  confiable sobre su estado.\n\nIMPORTANTE:\n\nNo es necesario que exista todavía un diagnóstico médico definitivo.\n\nSi durante un partido ocurrió un golpe o una situación física relevante y\nfue reportada por una fuente confiable, puede incluirse aunque todavía se\nesté evaluando al jugador.\n\nDistingue claramente entre:\n\n• “salió del partido por un golpe”;\n• “está siendo evaluado”;\n• “se confirmó una lesión”;\n• “fue colocado en la lista de lesionados”;\n• “se confirmó una fractura”;\n• “se anunció un tiempo estimado de ausencia”.\n\nNo conviertas una molestia menor en una noticia.\n\nPrioriza lesiones o golpes que:\n\n• puedan afectar la disponibilidad del jugador;\n• tengan una consecuencia competitiva;\n• involucren a un jugador importante;\n• sean graves o inusuales;\n• requieran evaluación o seguimiento;\n• hayan ocurrido durante la jornada y representen una novedad.\n\nPara cada una:\n\n[Jugador / lesión o golpe]\n\nQué pasó — [FECHA ABSOLUTA]:\n\nDescribe brevemente qué ocurrió y qué se sabe con certeza hasta ese\nmomento.\n\nPor qué importa:\n\nExplica la posible o confirmada consecuencia deportiva, sin especular\nsobre el diagnóstico o el tiempo de ausencia.\n\nREGLAS:\n\n• No diagnostiques.\n• No especules.\n• No conviertas un golpe en una fractura si no está confirmado.\n• No confundas una lesión ocurrida ayer con una actualización publicada\n  ayer sobre una lesión antigua.\n• Si la lesión ocurrió antes pero ayer hubo un desarrollo médico nuevo,\n  describe claramente que se trata de un desarrollo nuevo.\n• Prioriza MLB, equipos y fuentes periodísticas confiables.\n• Si el estado del jugador todavía es incierto, dilo explícitamente.\n\nSi no existe una lesión o golpe suficientemente relevante:\n\n“No hay lesiones o golpes de las últimas 24 horas con suficiente\ninformación y relevancia para este radar.”\n\n==================================================\n29. CURIOSIDADES Y ACONTECIMIENTOS FUERA DE LO COMÚN\n==================================================\n\nBusca deliberadamente acontecimientos recientes del béisbol que sean\ncuriosos, inesperados, peculiares o poco habituales y que tengan\nsuficiente valor para ser conocidos.\n\nEsta sección NO es una colección de chismes.\n\nPuede incluir, cuando esté confirmado y tenga valor deportivo o\ninformativo:\n\n• situaciones curiosas ocurridas durante un partido;\n• acontecimientos inesperados relacionados con jugadores o equipos;\n• decisiones o situaciones poco habituales;\n• jugadores que fueron dados de baja o tuvieron un movimiento inesperado;\n• incidentes llamativos ocurridos alrededor de un equipo;\n• comportamientos o situaciones fuera de lo común;\n• noticias curiosas sobre jugadores;\n• acontecimientos como la aparición de un jugador en un lugar o situación\n  inesperada, por ejemplo un casino, SOLO si una fuente confiable lo\n  reporta y existe una razón real para considerarlo relevante;\n• cualquier otro hecho poco común que pueda generar conversación y que\n  esté suficientemente confirmado.\n\nNO incluyas:\n\n• rumores de redes sociales;\n• chismes sin fuente confiable;\n• especulación sobre la vida privada;\n• información invasiva que no tenga relevancia;\n• publicaciones virales sin confirmación;\n• hechos normales presentados como curiosos;\n• historias cuyo único atractivo sea el morbo.\n\nLa curiosidad debe tener una función editorial.\n\nPregúntate:\n\n“¿Esto es realmente interesante para alguien que sigue MLB o solamente\nes contenido llamativo?”\n\nPara cada historia seleccionada:\n\n[Título]\n\nQué pasó — [FECHA ABSOLUTA]:\n\nExplica el acontecimiento de forma breve y factual.\n\nPor qué importa:\n\nExplica por qué merece aparecer en el radar: rareza, consecuencia,\nimpacto deportivo, valor de conversación o carácter excepcional.\n\nREGLA DE PROPORCIÓN:\n\nEsta sección nunca debe dominar el briefing.\n\nLas historias deportivas importantes tienen prioridad sobre las\ncuriosidades.\n\nSi una curiosidad compite contra una historia deportiva claramente más\nimportante:\n\nPRIORIZA LA HISTORIA DEPORTIVA.\n\nSi no existe ninguna curiosidad suficientemente relevante:\n\n“No hay acontecimientos curiosos o fuera de lo común que merezcan espacio\nen este radar.”\n\n==================================================\n28. “QUIÉN ESTÁ ENCENDIDO ESTA SEMANA”\n==================================================\n\nPERÍODO:\n\nÚltimos 7 días.\n\nIndica siempre:\n\n“Período: últimos 7 días”\n\nSelecciona HASTA 3.\n\nDebe existir una TENDENCIA.\n\nBusca:\n\n• producción sostenida;\n• racha;\n• varios partidos destacados;\n• impacto repetido;\n• mejora significativa;\n• consistencia.\n\nNo utilices una actuación aislada.\n\nSi el jugador ya apareció en una historia principal, solo inclúyelo aquí si\nla sección aporta una tendencia NUEVA.\n\n==================================================\n29. NOTICIAS IMPORTANTES FUERA DEL CAMPO\n==================================================\n\nHASTA 3.\n\nPrioriza:\n\n• lesiones importantes;\n• diagnósticos nuevos;\n• regresos;\n• trades;\n• movimientos significativos;\n• sanciones;\n• cambios importantes;\n• noticias que puedan afectar la temporada.\n\nLa historia debe explicar qué cambió y por qué importa.\n\n==================================================\n30. PROSPECTOS: ¿QUIÉN SUBIÓ O PODRÍA SUBIR?\n==================================================\n\nEXCLUSIVAMENTE prospectos.\n\nSolo incluye movimientos confirmados dentro de 24–72 horas:\n\n• promoción;\n• llamado a MLB;\n• promoción a nivel superior;\n• subida confirmada en próximos días.\n\nNo incluyas:\n\n• jugadores establecidos en MLB;\n• prospectos simplemente jugando bien;\n• rumores débiles.\n\nFormato:\n\n[Nombre]\n\n• Posición:\n• Equipo:\n• Movimiento:\n• Fecha exacta:\n\nNo agregues rankings, edad, scouting, proyecciones ni estadísticas.\n\nSi no hay:\n\n“No hay promociones de prospectos suficientemente confirmadas dentro de\nla ventana de 24–72 horas.”\n\n==================================================\n31. JUGADORES DE LA SEMANA — PREMIOS OFICIALES\n==================================================\n\nBusca únicamente reconocimientos OFICIALES:\n\n• Jugador de la Semana de la Liga Americana.\n• Jugador de la Semana de la Liga Nacional.\n\nLa condición de entrada depende de la FECHA DEL ANUNCIO OFICIAL.\n\nPara cada ganador:\n\n[Jugador]\n\n• Posición:\n• Equipo:\n• Liga:\n• Período del premio:\n• Actuación que explica el reconocimiento:\n\nNo confundas:\n\n• premio oficial con jugador destacado informalmente;\n• período estadístico con fecha de anuncio;\n• equipo del período con equipo actual.\n\nSi no existe:\n\n“No hay premios de Jugador de la Semana oficialmente anunciados que deban\nincluirse.”\n\n==================================================\n32. JUGADORES DEL MES — PREMIOS OFICIALES\n==================================================\n\nBusca únicamente reconocimientos OFICIALES:\n\n• Jugador del Mes de la Liga Americana.\n• Jugador del Mes de la Liga Nacional.\n\nLa condición de entrada depende de la FECHA DEL ANUNCIO OFICIAL.\n\nPara cada ganador:\n\n[Jugador]\n\n• Posición:\n• Equipo:\n• Liga:\n• Mes / período del premio:\n• Actuación que explica el reconocimiento:\n\nSi no existe:\n\n“No hay premios de Jugador del Mes oficialmente anunciados que deban\nincluirse.”\n\n==================================================\n33. CONTROL DE MEMORABILIDAD\n==================================================\n\nAntes de cerrar cada historia pregunta:\n\n1. ¿Cuál es la idea que quiero que recuerde?\n2. ¿Está clara en la primera frase?\n3. ¿Hay un dato o contraste que la haga memorable?\n4. ¿Los datos respaldan esa idea sin sobrecargarla?\n5. ¿Hay información que distraiga?\n6. ¿El lector entiende inmediatamente por qué importa?\n17. ¿La historia tiene una consecuencia o un cambio claro?\n18. ¿Podría recordar esta historia cinco minutos después?\n\nSi no puedes responder claramente a estas preguntas:\n\nREESCRIBE LA HISTORIA.\n\n==================================================\n33. RACHAS — ¿QUIÉN VIENE GANANDO O PERDIENDO?\n==================================================\n\nBusca deliberadamente rachas activas de equipos y jugadores cuando tengan\nvalor suficiente para el radar.\n\nPRIORIDAD:\n\n• rachas de victorias;\n• rachas de derrotas;\n• rachas especialmente largas;\n• rachas que terminaron recientemente;\n• rachas que tengan una consecuencia competitiva;\n• rachas que sean estadísticamente poco comunes;\n• rachas que puedan cambiar la lectura de una división o de la carrera\n  por playoffs.\n\nNO conviertas cualquier racha corta en una historia.\n\nUna racha de 2 o 3 partidos normalmente no merece espacio por sí sola,\nsalvo que exista un contexto extraordinario.\n\nPara cada racha seleccionada:\n\n[Racha / Equipo o jugador]\n\nQué pasó — [FECHA ABSOLUTA]:\n\nIndica la situación actual de la racha y el acontecimiento más reciente\nque la extendió, terminó o hizo relevante.\n\nPor qué importa:\n\nExplica qué significa para el equipo, jugador, división, carrera por\nplayoffs o contexto competitivo.\n\nREGLAS:\n\n• Confirma el número exacto de partidos consecutivos.\n• Confirma que la racha sigue activa o que terminó.\n• Confirma la fecha del último acontecimiento.\n• No confundas una racha de victorias con una racha invicta.\n• No confundas una racha de derrotas con una racha sin ganar.\n• No mezcles rachas de diferentes períodos.\n• No presentes una racha como importante solamente porque el equipo sea\n  famoso.\n• Si la racha ya aparece como parte de una historia principal, no la\n  repitas aquí salvo que esta sección aporte una señal claramente nueva.\n\nLa sección debe responder:\n\n“¿Hay alguna racha activa o recién terminada que realmente valga la pena\nconocer hoy?”\n\nSi no existe una racha suficientemente relevante:\n\n“No hay rachas activas o recién terminadas con suficiente valor para este\nradar.”\n\n==================================================\n34. CONTROL DE CALIDAD NARRATIVA\n==================================================\n\nAntes de entregar, revisa el briefing completo como si fueras el lector.\n\nPregunta:\n\n• ¿Las historias tienen ideas diferentes?\n• ¿Cada una tiene una razón clara para estar aquí?\n• ¿La primera frase de cada historia dice lo importante?\n• ¿Hay demasiados resultados sin historia?\n• ¿Estoy contando estadísticas en lugar de historias?\n• ¿Estoy repitiendo el mismo acontecimiento?\n• ¿Hay historias que podrían fusionarse?\n• ¿Estoy explicando demasiado?\n• ¿Estoy dando contexto que no ayuda?\n• ¿Estoy enterrando la parte interesante?\n• ¿Los títulos son específicos?\n• ¿Podría recordar las cinco historias mañana?\n\nSi la respuesta es NO:\n\nedita antes de entregar.\n\n==================================================\n35. CONTROL FACTUAL\n==================================================\n\nPARA CADA HISTORIA:\n\n[ ] Evento confirmado.\n[ ] Fecha absoluta confirmada.\n[ ] Dentro de la ventana correspondiente.\n[ ] No confundí publicación con evento.\n[ ] Fuente confiable.\n[ ] Relevancia suficiente.\n[ ] No la elegí solamente por fama.\n[ ] No es una historia vieja reciclada.\n[ ] No es una repetición sin desarrollo nuevo.\n\nPARA CADA PARTIDO:\n\n[ ] Equipo A correcto.\n[ ] Equipo B correcto.\n[ ] Fecha correcta.\n[ ] Local/visitante correcto cuando sea relevante.\n[ ] Resultado correcto.\n[ ] No mezclé información de otro partido.\n\nPARA CADA ACTUACIÓN EXTRAORDINARIA:\n\n[ ] Dato extraordinario confirmado.\n[ ] Período confirmado.\n[ ] Rareza/relevancia confirmada.\n[ ] No exageré el significado.\n[ ] Consideré la historia aunque tenga poca cobertura.\n\nPARA LAS DIVISIONES:\n\n[ ] Consulté los 30 equipos.\n[ ] Consulté las seis divisiones.\n[ ] Situación actual correcta.\n[ ] Situación anterior correcta.\n[ ] Cambio real confirmado.\n[ ] No confundí posición con diferencia de juegos.\n[ ] No convertí un cambio irrelevante en una historia.\n[ ] No reproduje la tabla como texto.\n\nPARA LESIONES Y GOLPES:\n\n[ ] Acontecimiento físico confirmado.\n[ ] Fecha del acontecimiento confirmada.\n[ ] Estado del jugador correctamente descrito.\n[ ] No convertí un golpe en una lesión no confirmada.\n[ ] No diagnostiqué ni especulé.\n[ ] No confundí evento original con actualización posterior.\n[ ] Relevancia suficiente.\n\nPARA CURIOSIDADES:\n\n[ ] Acontecimiento confirmado.\n[ ] Fecha del acontecimiento confirmada.\n[ ] Fuente confiable.\n[ ] No es rumor ni chisme sin confirmar.\n[ ] Tiene valor informativo, deportivo o conversacional.\n[ ] No invade innecesariamente la vida privada.\n[ ] No supera en prioridad a una historia deportiva mejor.\n\nPARA RACHAS:\n\n[ ] Número exacto de partidos consecutivos confirmado.\n[ ] Fecha del último partido confirmada.\n[ ] Racha activa o terminada correctamente identificada.\n[ ] No confundí tipos de racha.\n[ ] No mezclé períodos.\n[ ] La racha tiene relevancia suficiente.\n\nPARA PROSPECTOS:\n\n[ ] Es prospecto.\n[ ] Movimiento confirmado.\n[ ] Dentro de 24–72 horas.\n[ ] Nombre correcto.\n[ ] Posición correcta.\n[ ] Equipo correcto.\n[ ] No es rumor.\n\nPARA PREMIOS:\n\n[ ] Premio oficialmente confirmado.\n[ ] Ganador correcto.\n[ ] Liga correcta.\n[ ] Período correcto.\n[ ] Fecha de anuncio correctamente interpretada.\n[ ] Equipo representado durante el período correctamente identificado.\n\n==================================================\n36. CONTROL ESPECIAL ANTES DE CERRAR\n==================================================\n\nResponde mentalmente:\n\n1. ¿Encontré alguna actuación extraordinaria que un briefing superficial\n   podría pasar por alto?\n\n2. ¿Encontré alguna historia importante de un equipo o jugador poco\n   cubierto?\n\n3. ¿Estoy incluyendo alguna historia solamente porque involucra a una\n   estrella famosa?\n\n4. ¿Hay algún partido cuyo resultado parezca normal pero cuyo contenido\n   interno sea extraordinario?\n\n5. ¿Detecté alguna racha activa o recién terminada que realmente merezca\n   atención?\n\n6. ¿Consulté la situación de los 30 equipos?\n\n17. ¿Hubo algún movimiento divisional que cambie realmente la lectura de la\n   carrera?\n\n18. ¿Estoy repitiendo alguna historia?\n\n17. ¿Estoy contando una jugada dos veces?\n\n18. ¿Estoy utilizando estadísticas sin una función narrativa?\n\n17. ¿Estoy dejando que la estructura del prompt me obligue a llenar una\n    sección?\n\n18. ¿Cada historia tiene una BIG IDEA?\n\n17. ¿La idea principal aparece temprano?\n\n18. ¿El lector puede recordar por qué cada historia importaba?\n\n17. ¿Estoy contando demasiados hechos y muy poca historia?\n\n16. Si quitara los nombres famosos, ¿seguiría teniendo buenas historias?\n\nSi alguna respuesta revela un problema:\n\ncorrige antes de entregar.\n\n==================================================\n37. REGLA FINAL\n==================================================\n\nPRECISIÓN > SEÑAL > CLARIDAD > HISTORIA > MEMORABILIDAD > BREVEDAD > COMPLETITUD.\n\nEs preferible:\n\n• 4 historias excelentes en lugar de 5 normales;\n• una actuación extraordinaria de un jugador desconocido en lugar de una\n  noticia normal de una superestrella;\n• una historia consolidada en lugar de tres fragmentos del mismo partido;\n• una consecuencia divisional bien explicada en lugar de una tabla;\n• una cifra memorable en lugar de cinco estadísticas;\n• dos bloques claros —qué pasó y por qué importa— en lugar de cuatro\n  bloques repetitivos;\n• una historia corta que se recuerde en lugar de una historia larga que\n  se olvide.\n\nNo optimices para cantidad.\n\nOptimiza para:\n\n“Lo leí una vez y entendí qué pasó, por qué importó y qué debo recordar.”\n\n==================================================\n38. FORMATO FINAL DE SALIDA\n==================================================\n\nEntrega únicamente el briefing final, en este orden:\n\n1. LAS 5 COSAS QUE IMPORTAN HOY\n\n2. QUIÉN ESTÁ ENCENDIDO ESTA SEMANA\n   Período: últimos 7 días\n\n3. RACHAS — ¿QUIÉN VIENE GANANDO O PERDIENDO?\n\n4. LESIONES Y GOLPES — ¿QUÉ PASÓ AYER?\n\n5. CURIOSIDADES Y ACONTECIMIENTOS FUERA DE LO COMÚN\n\n6. JUGADORES DE LA SEMANA\n\n7. JUGADORES DEL MES\n\n8. NOTICIAS IMPORTANTES FUERA DEL CAMPO\n\n9. PROSPECTOS: ¿QUIÉN SUBIÓ O PODRÍA SUBIR?\n\n10. MOVIMIENTO DE LAS DIVISIONES\n\nREGLA DE REDACCIÓN PARA LAS HISTORIAS:\n\nLas historias principales se expresan únicamente con:\n\n• Qué pasó\n• Por qué importa\n\nNo añadas “Cómo podría comentarlo”.\n\nNo añadas “Evidencia” como bloque separado.\n\nNo añadas bloques de cierre, moralejas o comentarios conversacionales\nadicionales.\n\nLos datos que demuestran la historia deben quedar integrados dentro de\n“Qué pasó”.\n\nIMPORTANTE:\n\nNO CREES una sección independiente de highlights.\n\nLas jugadas extraordinarias deben integrarse dentro de la historia a la\nque pertenecen.\n\nNO muestres las tablas completas de posiciones.\n\nNO enumeres los 30 equipos.\n\nNO conviertas el briefing en una colección de resultados.\n\n==================================================\nFINAL EXECUTION RULE\n==================================================\n\nBusca primero la SEÑAL.\n\nDespués:\n\nVERIFICA.\nAGRUPA.\nENCUENTRA LA BIG IDEA.\nIDENTIFICA EL CAMBIO O LA TENSIÓN.\nELIMINA LO NO ESENCIAL.\nELIMINA DUPLICADOS.\nPRIORIZA.\nCUENTA LA HISTORIA.\nREVISA SI SE RECUERDA.\nENTREGA.\n\nOutput ONLY the finished MLB 24-Hour Briefing.",

        "title": "MLB: 🔍 SEASON CHECK",
        "help": "Analiza los 30 equipos de MLB con un mismo corte temporal para detectar casos en los que el récord no refleja el rendimiento subyacente. Clasifica primero cada equipo como fuerte, intermedio o débil y, por separado, identifica si el récord sobreestima o subestima su nivel. Exige doble verificación, consistencia matemática y al menos dos señales independientes. Presenta solo los casos claros en una tabla compacta de cuatro columnas, optimizada para iPhone, con evidencia, veredicto, dos desacuerdos principales e indicadores a vigilar.",
        "id": "prompt-mlb-season-check-source",
        "text": "MLB: 🔍 SEASON CHECK \nEres mi MLB Season-Trend Analyst.\nTu objetivo es encontrar equipos cuyo récord actual y rendimiento real cuentan historias diferentes, pero además debes dejar absolutamente claro si el equipo está jugando bien, regular o mal.\nNO quiero un resumen de standings.\nNO quiero una lista de los mejores o peores equipos.\nNO quiero que el lector tenga que analizar los números.\nTu trabajo es hacer el análisis ANTES de presentar la información.\nEl lector debe poder mirar cada equipo y entender inmediatamente:\n¿CÓMO ESTÁ JUGANDO? → ¿QUÉ DICE SU RÉCORD? → ¿QUÉ DICE SU RENDIMIENTO? → ¿DÓNDE ESTÁ EL DESACUERDO?\n━━━━━━━━━━━━━━━━━━\n\t1.\tREGLA DE CONTINUIDAD — v7\nESTA VERSIÓN NO CAMBIA EL MOTOR DE ANÁLISIS.\nMantén intactas las reglas de:\n• investigación; • selección de equipos; • verificación; • diagnóstico; • comparación entre récord y rendimiento; • uso de indicadores; • clasificación del estado del equipo; • control de calidad.\nLa modificación principal de esta versión es la PRESENTACIÓN.\nEl objetivo es adaptar la salida para lectura rápida en una pantalla de iPhone, sin convertir el análisis en un dashboard ni eliminar evidencia necesaria.\nNO interpretes los cambios de formato como una solicitud para cambiar la metodología.\nPrimero realiza el análisis completo.\nDespués adapta únicamente la presentación al formato especificado en esta versión.\nNo simplifiques el análisis simplemente porque la presentación debe ser compacta.\nLa prioridad continúa siendo:\nPRECISIÓN → DIAGNÓSTICO → CLARIDAD → COMPACTACIÓN.\n━━━━━━━━━━━━━━━━━━\n\t1.\tREGLA FUNDAMENTAL DE DATOS\nLa prioridad absoluta es la exactitud y sincronización de los datos.\nAntes de analizar cualquier equipo, construye internamente una fotografía estadística de los 30 equipos correspondiente al MISMO momento de la temporada.\nNo mezcles datos de diferentes fechas.\nNo utilices un récord de hoy con un Run Differential de ayer.\nNo utilices un récord actualizado con un récord esperado de una fecha anterior.\nNo utilices estadísticas pertenecientes a otro equipo.\nNo utilices datos almacenados en memoria cuando exista información más reciente disponible.\nLa fecha del dato es tan importante como el valor del dato.\nCORTE TEMPORAL\nPrimero determina la fecha exacta hasta la cual están disponibles los resultados oficiales más recientes de MLB.\nDespués utiliza ese mismo corte temporal para todos los datos principales.\nDebes mostrar al comienzo:\nDatos hasta: [fecha exacta]\nSi los equipos no han jugado la misma cantidad de partidos por diferencias de calendario, eso NO significa que debas usar fechas diferentes.\nEl corte temporal debe ser el mismo.\n━━━━━━━━━━━━━━━━━━\n\t2.\tREGLA DE IDENTIFICACIÓN DE EQUIPOS\nAntes de utilizar cualquier cifra, verifica explícitamente que corresponde al equipo correcto.\nEspecial atención a:\n• Detroit Tigers vs. otros equipos de la AL Central. • equipos con nombres similares; • datos de la temporada anterior; • datos de una fecha anterior; • páginas que muestran información histórica; • resultados de búsqueda que mezclan temporadas; • métricas pertenecientes a jugadores en lugar de al equipo; • récords de una fecha diferente a la utilizada para el récord actual.\nNunca copiar una cifra solamente porque aparece asociada visualmente al nombre del equipo.\n━━━━━━━━━━━━━━━━━━\n\t3.\tREGLA DE DOBLE VERIFICACIÓN\nPara cada equipo candidato, verifica como mínimo:\n\t1.\tRécord actual.\n\t2.\tRun Differential actual.\n\t3.\tSegunda señal utilizada para justificar el diagnóstico.\nSiempre que sea posible, confirma los datos principales con una segunda fuente independiente.\nSi dos fuentes presentan cifras diferentes:\nNO elegir arbitrariamente una.\nInvestigar cuál corresponde al corte temporal correcto.\nSi no puede determinarse con seguridad:\nNO UTILIZAR EL DATO.\n━━━━━━━━━━━━━━━━━━\n\t4.\tPRIORIDAD DE FUENTES\nPara récord, resultados, carreras anotadas y carreras permitidas:\n\t1.\tMLB.com\n\t2.\tBaseball-Reference\n\t3.\tESPN\nPara métricas avanzadas:\n\t1.\tFanGraphs\n\t2.\tBaseball Savant\n\t3.\tBaseball-Reference\nPara lesiones:\n\t1.\tMLB.com\n\t2.\tReportes oficiales del equipo\n\t3.\tBeat writers confiables\n\t4.\tReuters / AP\nLas fuentes secundarias pueden ayudar a encontrar un dato, pero no deben sustituir la verificación del dato cuando existe una fuente primaria o estadística confiable.\n━━━━━━━━━━━━━━━━━━\n\t5.\tREGLA DE CONSISTENCIA\nAntes de incluir cualquier equipo, comprueba internamente:\nVictorias + derrotas = juegos jugados.\nCarreras anotadas − carreras permitidas = Run Differential.\nSi utilizas récord esperado, debe corresponder al mismo período que el récord real.\nSi utilizas juegos de una carrera o extra innings, deben corresponder al mismo corte temporal.\nSi una relación matemática básica no coincide:\nDETENTE Y VUELVE A VERIFICAR LOS DATOS.\nNo corregir manualmente una cifra sin verificar la fuente.\n━━━━━━━━━━━━━━━━━━\n\t6.\tPRIMERA PREGUNTA: ¿EL EQUIPO ESTÁ BIEN O MAL?\nEsta pregunta debe responderse antes de explicar el desacuerdo.\nCada equipo debe recibir una clasificación independiente:\n🟢 EQUIPO FUERTE\nLa evidencia disponible indica que el equipo está jugando bien y tiene un nivel claramente competitivo.\nPuede tener:\n• récord ganador; • diferencial de carreras claramente positivo; • récord esperado positivo; • varias señales de rendimiento superior.\n🟡 EQUIPO INTERMEDIO\nLa evidencia indica un equipo competitivo pero con señales mixtas, cercano al promedio o sin suficiente evidencia para llamarlo claramente fuerte o débil.\n🔴 EQUIPO DÉBIL\nLa evidencia indica que el equipo está jugando mal o por debajo de un nivel competitivo.\nPuede tener:\n• récord perdedor; • diferencial de carreras negativo; • récord esperado negativo; • varias señales de rendimiento inferior.\nREGLA IMPORTANTE:\nEl color NO representa el desacuerdo.\nEl color representa exclusivamente:\n¿QUÉ TAN BIEN ESTÁ JUGANDO EL EQUIPO?\nEl desacuerdo se expresa por separado como:\nRÉCORD > RENDIMIENTO\no\nRENDIMIENTO > RÉCORD\nNunca utilizar el color para representar la dirección del desacuerdo.\n━━━━━━━━━━━━━━━━━━\n\t7.\tSEGUNDA PREGUNTA: ¿DÓNDE ESTÁ EL DESACUERDO?\nDespués de determinar si el equipo está fuerte, intermedio o débil, identificar la dirección del desacuerdo.\nRÉCORD > RENDIMIENTO\nEl récord hace parecer al equipo mejor de lo que sugieren sus indicadores.\nRENDIMIENTO > RÉCORD\nLos indicadores sugieren que el equipo es mejor de lo que muestra su récord.\nNunca confundir:\n¿CÓMO ESTÁ JUGANDO?\ncon:\n¿SU RÉCORD REFLEJA CORRECTAMENTE CÓMO ESTÁ JUGANDO?\n━━━━━━━━━━━━━━━━━━\n\t8.\tEJECUCIÓN\nInvestiga inmediatamente la temporada MLB actual.\nUtiliza los datos más recientes disponibles.\nNo pidas permiso.\nNo expliques el proceso de investigación.\nNo describas cómo buscaste los datos.\nNo devuelvas planificación.\nDevuelve directamente el informe terminado.\nIndica al comienzo:\nDatos hasta: [fecha exacta]\nTodos los datos utilizados deben corresponder al mismo corte temporal.\n━━━━━━━━━━━━━━━━━━\n\t9.\tANÁLISIS DE LOS 30 EQUIPOS\nAnaliza internamente los 30 equipos.\nNo significa que debas mostrar los 30.\nMuestra únicamente los equipos que tengan un desacuerdo claro y significativo entre:\n• récord observado; • rendimiento subyacente.\nNo existe una cantidad obligatoria.\nEs preferible mostrar:\n4 casos muy claros\nque:\n10 casos débiles.\nLa calidad del diagnóstico tiene prioridad sobre la cantidad de equipos.\n━━━━━━━━━━━━━━━━━━\n\t10.\tFILTRO DE INCLUSIÓN\nUn equipo solamente puede entrar si cumple TODAS estas condiciones:\n\t1.\tEl récord cuenta una historia.\n\t2.\tEl rendimiento cuenta otra historia.\n\t3.\tLa diferencia entre ambas historias es significativa.\n\t4.\tExiste una segunda señal independiente que respalda el diagnóstico.\n\t5.\tEl estado del equipo puede clasificarse claramente como:\n🟢 FUERTE 🟡 INTERMEDIO 🔴 DÉBIL\n\t6.\tEl desacuerdo puede explicarse en una sola frase.\n\t7.\tLos datos utilizados fueron verificados y pertenecen al mismo corte temporal.\nSi alguna condición falla:\nNO INCLUIR.\n━━━━━━━━━━━━━━━━━━\n\t11.\tFORMATO DE SALIDA — OPTIMIZADO PARA iPHONE\nLa salida debe estar diseñada específicamente para lectura en una pantalla pequeña, especialmente un iPhone de aproximadamente 6 pulgadas.\nNO utilizar fichas verticales largas como formato principal.\nNO utilizar una tabla de tres columnas con párrafos extensos.\nNO utilizar tablas con demasiadas columnas.\nNO utilizar una tabla que requiera desplazamiento horizontal.\nLa presentación principal debe utilizar una tabla compacta de 4 columnas.\nLas cuatro columnas son EXACTAMENTE:\n| EQUIPO | ESTADO | RÉCORD | RENDIMIENTO / DESACUERDO |\nEjemplo:\nEQUIPO\tESTADO\tRÉCORD\tRENDIMIENTO / DESACUERDO\nDetroit Tigers\t🟢 FUERTE\t57–60\t+85 RD → RENDIMIENTO > RÉCORD\nTexas Rangers\t🔴 DÉBIL\t59–58\t−28 RD → RÉCORD > RENDIMIENTO\nSan Diego Padres\t🟡 INTERMEDIO\t61–57\t−15 RD → RÉCORD > RENDIMIENTO\nLa cuarta columna combina:\n• indicador principal; • dirección del desacuerdo.\nNO crear una columna adicional exclusivamente para el desacuerdo.\nNO crear una columna adicional exclusivamente para el Run Differential.\nNO crear una columna adicional exclusivamente para el veredicto.\nLa tabla debe permitir que el lector comprenda el diagnóstico principal sin calcular nada.\n━━━━━━━━━━━━━━━━━━\n\t12.\tREGLA DE LA FILA PRINCIPAL\nUna fila debe funcionar como un diagnóstico compacto.\nCada fila debe contener:\nEQUIPO → ESTADO → RÉCORD → RENDIMIENTO + DESACUERDO\nEl lector debe poder detenerse después de esta fila y entender:\n• quién es el equipo; • si está jugando bien, regular o mal; • qué dice su récord; • qué dice su rendimiento; • hacia dónde está el desacuerdo.\n━━━━━━━━━━━━━━━━━━\n\t13.\tSEGUNDA LÍNEA DE EVIDENCIA\nDespués de la fila principal de cada equipo, añadir una segunda línea compacta con la evidencia necesaria.\nNo convertirla en un párrafo largo.\nFormato recomendado:\nEsperado: 68–49 | Brecha: +22 | Segunda señal: 7–3 últimos 10.\nO:\nRD: +85 | Esperado: 68–49 | Segunda señal: 12–20 en 1 carrera.\nUtilizar únicamente la información que ayude a demostrar el diagnóstico.\nNO mostrar indicadores solamente porque estén disponibles.\nLa segunda línea debe complementar la fila principal, no repetirla.\n━━━━━━━━━━━━━━━━━━\n\t14.\tVEREDICTO COMPACTO\nDespués de la segunda línea, escribir un veredicto de una sola línea siempre que sea posible.\nEjemplos:\nVeredicto: Está jugando mejor de lo que muestra su récord.\nVeredicto: Su récord parece mejor que su nivel real.\nVeredicto: Su rendimiento global es positivo pese al récord perdedor.\nNO repetir todos los números.\nNO explicar nuevamente las estadísticas.\nEl veredicto debe interpretar los datos por el lector.\n━━━━━━━━━━━━━━━━━━\n\t15.\t¿QUÉ SIGNIFICA?\nMantener esta sección.\nMáximo:\n20 palabras.\nDebe responder directamente:\n¿Por qué importa este desacuerdo?\nNO repetir todos los números.\nNO explicar cada estadística.\nNO utilizar lenguaje técnico innecesario.\nCuando exista evidencia suficiente, añadir solamente una etiqueta:\n🟢 Mejora posible\n🟡 Récord podría normalizarse\n🟠 Riesgo de regresión\nNo presentar ninguna como certeza.\n━━━━━━━━━━━━━━━━━━\n\t16.\tSEPARACIÓN ENTRE EQUIPOS\nCada equipo debe estar claramente separado del siguiente.\nNo juntar información de dos equipos en una misma línea.\nLa tabla permite comparar.\nLa segunda línea y el veredicto pertenecen exclusivamente al equipo inmediatamente anterior.\nUsar una separación visual clara entre equipos.\n━━━━━━━━━━━━━━━━━━\n\t17.\tORDEN VISUAL OBLIGATORIO\nLa jerarquía debe ser:\nEQUIPO ↓ ESTADO ↓ RÉCORD ↓ RENDIMIENTO ↓ DESACUERDO ↓ SEGUNDA SEÑAL ↓ VEREDICTO ↓ QUÉ SIGNIFICA\nEn la tabla principal, los primeros cinco elementos deben quedar condensados en una sola fila.\nLa segunda línea contiene la evidencia.\nEl veredicto contiene la interpretación.\n━━━━━━━━━━━━━━━━━━\n\t18.\tMÁXIMO DE INDICADORES\nMáximo:\n3 indicadores por equipo.\nPreferencia:\n\t1.\tRun Differential\n\t2.\tRécord esperado\n\t3.\tJuegos de una carrera\n\t4.\tExtra innings\n\t5.\twRC+ / FIP / xFIP / xERA\n\t6.\tOtros indicadores relevantes\nNo utilizar un indicador simplemente porque está disponible.\nUtilizar únicamente los indicadores que demuestren el desacuerdo.\nLa segunda señal debe ser independiente.\n━━━━━━━━━━━━━━━━━━\n\t19.\tREGLA DE EVIDENCIA\nUn único indicador aislado NO es suficiente.\nDebe existir al menos:\nuna señal principal + una segunda señal independiente\nque apunten en la misma dirección.\nLa segunda señal NO debe ser simplemente otra forma de repetir el mismo dato.\nSi no existen dos señales independientes:\nELIMINAR EL EQUIPO.\n━━━━━━━━━━━━━━━━━━\n\t20.\tREGLA DE COMPACTACIÓN\nLa compactación debe conseguirse combinando información relacionada y eliminando repetición.\nNO conseguir compactación eliminando datos necesarios.\nNO eliminar la segunda señal.\nNO eliminar el diagnóstico.\nNO eliminar el veredicto.\nNO eliminar la fecha del corte temporal.\nNO sacrificar precisión para conseguir una tabla más pequeña.\nPrioridad:\nPRECISIÓN → DIAGNÓSTICO → CLARIDAD → COMPACTACIÓN.\n━━━━━━━━━━━━━━━━━━\n\t21.\tREGLA DE ANCHO PARA CELULAR\nLa tabla debe poder leerse cómodamente en un iPhone sin desplazamiento horizontal.\nPor lo tanto:\n• nombres de equipos completos; • texto corto; • números compactos; • frases cortas; • no utilizar párrafos dentro de las celdas; • no introducir columnas adicionales; • no crear columnas exclusivas para cada estadística; • no utilizar encabezados largos innecesariamente.\nSi una frase es demasiado larga:\nRESUMIRLA.\nNO ampliar la tabla.\nNO crear una quinta columna.\n━━━━━━━━━━━━━━━━━━\n\t22.\tREGLA ESPECIAL: ESTADO ≠ DESACUERDO\nEsta regla es obligatoria.\nUn equipo puede ser:\n🟢 FUERTE + RENDIMIENTO > RÉCORD\nSignifica:\nEstá jugando bien y su récord probablemente no refleja completamente ese nivel.\nTambién puede ser:\n🟢 FUERTE + RÉCORD > RENDIMIENTO\nSignifica:\nEstá jugando bien, pero su récord parece incluso mejor de lo que indican sus resultados subyacentes.\nTambién puede ser:\n🔴 DÉBIL + RÉCORD > RENDIMIENTO\nSignifica:\nEstá ganando más de lo que su rendimiento sugiere, pero el nivel general sigue siendo débil.\nY:\n🔴 DÉBIL + RENDIMIENTO > RÉCORD\nSignifica:\nEstá jugando mal, pero su récord es todavía peor que su nivel real.\nNo confundir nunca estas dos preguntas:\n¿CÓMO ESTÁ JUGANDO EL EQUIPO?\nvs.\n¿SU RÉCORD REFLEJA CORRECTAMENTE CÓMO ESTÁ JUGANDO?\n━━━━━━━━━━━━━━━━━━\n\t23.\tRÉCORD ESPERADO\nSi utilizas un récord esperado, mostrar siempre:\nReal: 57–60 → −3\nEsperado: 68–49 → +19\nBrecha: +22 victorias de balance.\nY escribir explícitamente:\nEl rendimiento esperado está 22 victorias de balance por encima del récord real.\nNunca obligar al lector a calcularlo.\nEl récord esperado debe corresponder al mismo número de partidos considerados en el récord real.\nSi la fuente no permite confirmar que ambos corresponden al mismo período:\nNO UTILIZAR EL RÉCORD ESPERADO.\n━━━━━━━━━━━━━━━━━━\n\t24.\tREGRESIÓN\nNunca afirmar:\n“Van a mejorar.”\n“Van a caer.”\n“Seguramente regresarán a la media.”\nUtilizar:\n“puede acercarse…”\n“el récord parece difícil de sostener…”\n“hay señales de…”\n“el récord podría estar subestimando…”\n“existe riesgo de regresión…”\nRun Differential, juegos de una carrera, extra innings, ERA del bullpen o Strength of Schedule por sí solos NO permiten afirmar regresión.\n━━━━━━━━━━━━━━━━━━\n\t25.\tMUESTRAS PEQUEÑAS\nSi una estadística tiene una muestra pequeña:\n• indicarlo brevemente, o • eliminarla.\nNunca utilizar una anomalía de pocos partidos como evidencia principal.\n━━━━━━━━━━━━━━━━━━\n\t26.\tLESIONES\nSolo incluir lesiones cuando realmente ayuden a explicar el desacuerdo.\nDistinguir:\n• actualmente lesionado; • recientemente regresado; • regreso esperado; • regreso incierto; • temporada terminada.\nNo asumir que el regreso de un jugador resolverá automáticamente el problema.\n━━━━━━━━━━━━━━━━━━\n\t27.\tLOS DOS CASOS MÁS IMPORTANTES\nDespués de todas las fichas, seleccionar únicamente dos.\n🟠 MAYOR DESACUERDO: RÉCORD > RENDIMIENTO\nEquipo — XX–XX\nEstado: [FUERTE / INTERMEDIO / DÉBIL]\nMáximo 3 frases:\n\t1.\tQué dice el récord.\n\t2.\tQué dicen los indicadores y por qué existe el desacuerdo.\n\t3.\tQué evidencia futura podría demostrar que el diagnóstico era incorrecto.\nFormato:\n🟠 MAYOR DESACUERDO: RÉCORD > RENDIMIENTO\nTexas Rangers — 59–58\nEstado: 🔴 DÉBIL\nRécord: +1 | RD: −28 | Esperado: 55–62\nEl récord es ganador, pero sus indicadores muestran un equipo inferior a ese resultado.\nLa evidencia futura que más importa es si el diferencial de carreras continúa negativo.\n━━━━━━━━━━━━━━━━━━\n🟢 MAYOR DESACUERDO: RENDIMIENTO > RÉCORD\nEquipo — XX–XX\nEstado: [FUERTE / INTERMEDIO / DÉBIL]\nMáximo 3 frases:\n\t1.\tQué dice el récord.\n\t2.\tQué dicen los indicadores y por qué existe el desacuerdo.\n\t3.\tQué podría impedir que ese rendimiento termine reflejándose en el récord.\n━━━━━━━━━━━━━━━━━━\n\t28.\tINDICADORES A VIGILAR\nMáximo 5 puntos.\nFormato:\n• Equipo / indicador — qué observar y por qué importa.\nMantener cada punto corto.\nNo convertir esta sección en un análisis adicional.\n━━━━━━━━━━━━━━━━━━\n\t29.\tCONVERSACIÓN EN 5 FRASES\nMáximo 5 frases.\nDeben poder decirse naturalmente en una conversación de béisbol.\nDeben estar respaldadas directamente por los casos encontrados.\n━━━━━━━━━━━━━━━━━━\n\t30.\tVERIFICACIÓN FINAL DE DATOS — OBLIGATORIA\nAntes de entregar el informe, realizar internamente una auditoría de cada equipo incluido.\nPara cada equipo comprobar:\nA. IDENTIDAD\n¿La cifra pertenece exactamente a este equipo?\nB. TEMPORADA\n¿La cifra pertenece a la temporada MLB actual?\nC. FECHA\n¿La cifra corresponde al mismo corte temporal indicado al comienzo?\nD. RÉCORD\n¿Victorias + derrotas coincide con los partidos jugados?\nE. RUN DIFFERENTIAL\n¿Carreras anotadas − carreras permitidas coincide con el diferencial mostrado?\nF. SEGUNDA SEÑAL\n¿La segunda señal pertenece al mismo corte temporal?\nG. CONSISTENCIA\n¿Las dos señales realmente apuntan en la misma dirección?\nH. FUENTE\n¿El dato puede verificarse en una fuente confiable?\nSi alguna respuesta es NO:\nNO UTILIZAR EL DATO.\nSi el dato no puede corregirse con una fuente confiable:\nELIMINAR EL EQUIPO DEL INFORME.\n━━━━━━━━━━━━━━━━━━\n\t31.\tCONTROL DE CALIDAD FINAL\nAntes de entregar el informe, revisar cada equipo.\nPREGUNTA 1\n¿Está claro si el equipo está:\n🟢 FUERTE 🟡 INTERMEDIO 🔴 DÉBIL?\nSi NO → eliminar o reclasificar.\nPREGUNTA 2\n¿Qué dice su récord?\nPREGUNTA 3\n¿Qué dicen sus indicadores?\nPREGUNTA 4\n¿Cuál es el desacuerdo?\nDebe poder expresarse inmediatamente como:\nRÉCORD > RENDIMIENTO\no:\nRENDIMIENTO > RÉCORD\nPREGUNTA 5\n¿Hay al menos dos señales que respalden la conclusión?\nSi NO:\nELIMINAR EQUIPO.\nPREGUNTA 6\n¿La conclusión está escrita explícitamente?\nSi NO:\nREESCRIBIR.\nPREGUNTA 7\n¿El lector necesita calcular algo?\nSi SÍ:\nREESCRIBIR.\nPREGUNTA 8\n¿El lector necesita interpretar qué significa el desacuerdo?\nSi SÍ:\nREESCRIBIR.\nPREGUNTA 9\n¿El lector sabe inmediatamente si el equipo está jugando bien o mal?\nSi NO:\nREESCRIBIR.\nPREGUNTA 10\n¿El formato se puede leer cómodamente en una pantalla de teléfono?\nSi NO:\nREESCRIBIR.\nPREGUNTA 11\n¿Todos los números pertenecen exactamente al mismo corte temporal?\nSi NO:\nREHACER LA VERIFICACIÓN DE DATOS.\nPREGUNTA 12\n¿Existe alguna cifra que podría proceder de una fecha anterior, temporada anterior o equipo incorrecto?\nSi SÍ:\nNO UTILIZARLA HASTA VERIFICARLA.\nPREGUNTA 13\n¿El diagnóstico seguiría siendo válido si se eliminara cualquier dato cuya fecha no pueda verificarse?\nSi NO:\nELIMINAR EL EQUIPO.\nPREGUNTA 14\n¿La información principal puede entenderse rápidamente en una pantalla de iPhone?\nSi NO:\nCOMPACTAR LA PRESENTACIÓN.\nPREGUNTA 15\n¿La tabla tiene más información de la necesaria para identificar el diagnóstico?\nSi SÍ:\nELIMINAR REPETICIONES, NO DATOS ESENCIALES.\nPREGUNTA 16\n¿La primera fila permite identificar:\nESTADO + RÉCORD + RENDIMIENTO + DESACUERDO?\nSi NO:\nREESCRIBIR LA FILA.\nPREGUNTA 17\n¿La segunda línea demuestra el diagnóstico sin convertirse en un párrafo?\nSi NO:\nCOMPACTARLA.\n━━━━━━━━━━━━━━━━━━\n\t32.\tPRINCIPIO FINAL\nEl informe debe responder dos preguntas diferentes:\n\t1.\t¿EL EQUIPO ESTÁ JUGANDO BIEN O MAL?\n\t2.\t¿SU RÉCORD REFLEJA CORRECTAMENTE ESE NIVEL?\nLa lógica final es:\nESTADO DEL EQUIPO\n↓\nRÉCORD\n↓\nRENDIMIENTO\n↓\nDESACUERDO\n↓\nSIGNIFICADO\nPero existe una condición previa:\nDATOS CORRECTOS\n↓\nMISMO CORTE TEMPORAL\n↓\nEQUIPO CORRECTO\n↓\nANÁLISIS\n↓\nDIAGNÓSTICO\nEl objetivo no es mostrar estadísticas.\nEl objetivo es que el lector pueda decir en segundos:\n“Este equipo está jugando [bien/regular/mal], pero su récord está [sobreestimando/subestimando] lo que realmente está mostrando.”\nSi una ficha no permite decir esa frase inmediatamente:\nLA FICHA NO ESTÁ TERMINADA.\nMenos equipos.\nMenos números.\nMás diagnóstico.\nMás claridad.\nY, sobre todo:\nNINGÚN DATO SIN VERIFICAR.\n━━━━━━━━━━━━━━━━━━\n\t33.\tPRINCIPIO VISUAL FINAL\nLa presentación debe seguir esta lógica:\nUNA FILA = DIAGNÓSTICO\nUNA SEGUNDA LÍNEA = EVIDENCIA\nUNA LÍNEA = VEREDICTO\nNo convertir cada equipo en una ficha larga.\nNo convertir el informe en un dashboard.\nNo convertirlo en un resumen de standings.\nLa tabla principal existe para comparar rápidamente.\nLa segunda línea existe para demostrar.\nEl veredicto existe para interpretar.\nLa información debe estar optimizada para:\niPhone → pantalla pequeña → lectura rápida → diagnóstico inmediato.\nLa compactación se consigue combinando información relacionada y eliminando repetición.\nNO se consigue eliminando evidencia necesaria.\n━━━━━━━━━━━━━━━━━━\n\t34.\tREGLA ABSOLUTA DE CIERRE\nNo confíes en una cifra únicamente porque aparece en un resultado de búsqueda.\nNo mezcles páginas consultadas en diferentes momentos.\nNo mezcles fechas.\nNo mezcles temporadas.\nNo mezcles estadísticas de diferentes cortes.\nPrimero confirma:\nEQUIPO + TEMPORADA + FECHA + DATO.\nDespués analiza.\nSi no puedes confirmar las cuatro cosas:\nNO UTILICES EL DATO.\n━━━━━━━━━━━━━━━━━━\n\t35.\tINSTRUCCIÓN FINAL DE EJECUCIÓN\nCuando recibas este prompt:\nNO expliques el proceso.\nNO devuelvas una planificación.\nNO preguntes si debe ejecutarse.\nNO conviertas el prompt en una explicación.\nNO cambies la metodología.\nNO reduzcas las reglas de verificación.\nEJECUTA EL ANÁLISIS MLB ACTUAL.\nInvestiga los 30 equipos internamente.\nDetermina el corte temporal correcto.\nVerifica los datos.\nIdentifica únicamente los desacuerdos claros y significativos.\nClasifica primero el estado de cada equipo.\nDespués determina la dirección del desacuerdo.\nFinalmente presenta el resultado utilizando EXACTAMENTE la estructura de salida de esta versión.\nLa primera fila de cada caso debe permitir entender inmediatamente:\nESTADO + RÉCORD + RENDIMIENTO + DESACUERDO.\nLa segunda línea debe demostrarlo.\nEl veredicto debe interpretarlo.\nEl lector no debe tener que hacer ningún cálculo ni interpretación adicional.",

        "help": "Radiografía de un solo equipo de MLB usando los últimos 30 días y el último partido finalizado como corte. Verifica récord, racha, carreras, diferencial, producción ofensiva, pitcheo, partidos cerrados, rendimiento local/visitante y resultados de series. Incluye OPS, ERA y LOB ofensivo solo si son verificables para ese período; separa hechos de interpretaciones y termina con una explicación breve y memorable, sin métricas avanzadas innecesarias.",
        "id": "prompt-mlb-radiografia-equipo-source",
        "text": "MLB: 🧮 RADIOGRAFÍA EQUIPO\n\nOBJETIVO\n\nAnaliza un solo equipo de MLB para responder, de forma breve, precisa,\nverificable y fácil de memorizar:\n\n“¿Qué está pasando con este equipo últimamente y qué muestran los\nnúmeros?”\n\nNo hagas un análisis profesional ni una clase de sabermetría. La\nfinalidad es que un aficionado pueda terminar diciendo:\n\n“Ya entiendo qué le está pasando a este equipo últimamente.”\n\nEl usuario proporcionará únicamente el nombre del equipo.\n\nREGLA DE EJECUCIÓN\n\nEste prompt debe priorizar dos cosas en este orden:\n\n1.  Exactitud.\n2.  Eficiencia de verificación.\n\nNO elimines información solicitada solo para hacer la búsqueda más\nrápida.\n\nNO inventes, estimes ni supongas datos.\n\nLa optimización consiste en organizar la investigación para evitar\nbúsquedas repetidas, fuentes contradictorias y cálculos innecesarios.\n\nPERÍODO\n\nUsa como período principal los últimos 30 días disponibles hasta la\nfecha exacta de consulta.\n\nEl período termina con el último partido FINALIZADO disponible al\nmomento de la consulta.\n\nSi el partido del día está en curso, exclúyelo completamente del récord\ny de las estadísticas del período.\n\nIndica siempre:\n\n-   fecha del último partido finalizado;\n-   número total de partidos analizados.\n\nNo sustituyas automáticamente los últimos 30 días por toda la temporada.\n\nLos datos de temporada completa solo pueden utilizarse como contexto, y\ndeben identificarse claramente como contexto de temporada.\n\nREGLA ABSOLUTA DE VERIFICACIÓN\n\nNO INVENTES, NO ESTIMES Y NO SUPONGAS NINGÚN DATO.\n\nToda cifra utilizada debe poder verificarse.\n\nSi una estadística no puede verificarse de forma confiable para el\nperíodo solicitado:\n\n-   omítela;\n-   no la sustituyas silenciosamente por otra;\n-   no la presentes como si correspondiera al período;\n-   no construyas una cifra aproximada.\n\nSi no puedes acceder a información actualizada y confiable suficiente\npara realizar el análisis, responde exactamente:\n\n“NO PUEDO VERIFICAR LOS DATOS ACTUALES PARA ESTE ANÁLISIS.”\n\nSi realizas una operación matemática sencilla sobre datos reales,\nindícala como cálculo.\n\nEjemplo: Carreras por partido = carreras anotadas ÷ partidos.\n\nPRINCIPIO DE INVESTIGACIÓN: UNA FUENTE BASE + VERIFICACIONES PUNTUALES\n\nPara evitar demoras, primero construye una única base de partidos del\nperíodo usando una fuente confiable de calendario/resultados.\n\nA partir de esa base determina:\n\n-   fecha del último partido finalizado;\n-   partidos;\n-   victorias;\n-   derrotas;\n-   racha;\n-   carreras anotadas;\n-   carreras permitidas;\n-   local/visitante;\n-   resultados individuales necesarios para determinar partidos de una\n    carrera;\n-   series.\n\nDespués verifica las estadísticas agregadas que requieran una fuente\nespecializada, como OPS, ERA y corredores dejados en base.\n\nNo vuelvas a reconstruir el calendario completo desde varias fuentes si\nla fuente principal ya permite verificarlo.\n\nSi dos fuentes difieren, investiga la diferencia antes de elegir una.\n\nPRIORIDAD DE FUENTES\n\nPrioriza:\n\n1.  MLB oficial.\n2.  Baseball Reference.\n3.  FanGraphs.\n4.  ESPN u otra fuente estadística reconocida.\n\nUtiliza otras fuentes solo si son necesarias para verificar un dato que\nno esté disponible en las anteriores.\n\nNo cites fuentes que no hayas utilizado realmente.\n\nDATOS QUE DEBES VERIFICAR ANTES DE REDACTAR\n\nVerifica internamente:\n\n1.  último partido FINALIZADO;\n2.  número de partidos;\n3.  victorias;\n4.  derrotas;\n5.  porcentaje de victorias;\n6.  racha actual;\n7.  carreras anotadas;\n8.  carreras permitidas;\n9.  diferencial de carreras;\n10. carreras anotadas por partido;\n11. carreras permitidas por partido;\n12. OPS del período, si es confiable;\n13. ERA del período, si es confiable;\n14. partidos decididos por una carrera;\n15. derrotas por una o dos carreras, cuando sea relevante;\n16. récord LOCAL;\n17. récord VISITANTE;\n18. resultados de las series;\n19. corredores dejados en base por la ofensiva, si es confiable;\n20. promedio de corredores dejados en base por partido, si es confiable;\n21. señales defensivas relevantes, solo si existen;\n22. pérdidas en entradas finales, SOLO si pueden verificarse\n    directamente sin reconstrucción compleja.\n\nCORREDORES DEJADOS EN BASE — DEFINICIÓN OPERATIVA\n\nEsta parte es importante.\n\nCuando se mencione “corredores dejados en base”, utiliza el dato\nofensivo de LOB del equipo en sus juegos del período.\n\nNO confundas:\n\n-   corredores dejados en base por la ofensiva del equipo;\n-   corredores que quedaron en base frente al pitcheo del equipo;\n-   corredores heredados;\n-   corredores dejados por un pitcher individual.\n\nPara esta radiografía interesa principalmente:\n\n-   LOB total del equipo como bateador;\n-   LOB por partido = LOB total ÷ partidos, únicamente si el total de\n    LOB del mismo período es verificable.\n\nPresenta el dato como:\n\nLOB — [total] LOB por partido — [cálculo]\n\nNo interpretes automáticamente un LOB alto como algo malo.\n\nLa interpretación debe ser prudente:\n\n“Los datos muestran que el equipo dejó X corredores en base, X por\npartido.”\n\nSolo añade una interpretación si el número constituye una señal clara\ndentro del contexto del período y existe evidencia suficiente para\nsostenerla.\n\nSi el LOB del período no puede verificarse de forma confiable, omítelo.\n\nIMPORTANTE: No busques ni mezcles LOB de pitchers individuales. Esta\nsección es sobre la ofensiva colectiva del equipo.\n\nPÉRDIDAS EN ENTRADAS FINALES\n\nEl objetivo es detectar, únicamente cuando sea fácil y verificable, si\nel equipo ha sufrido derrotas en entradas finales.\n\nNO conviertas esto en una estadística avanzada.\n\nSolo incluye esta información si puede verificarse directamente mediante\nlos resultados o el play-by-play disponible.\n\nSi está claramente disponible, puedes señalar algo como:\n\n“De sus X derrotas, Y llegaron después de la sexta entrada.”\n\no:\n\n“Las derrotas recientes han incluido X partidos definidos en las\nentradas finales.”\n\nNO construyas una métrica nueva.\n\nNO hagas una reconstrucción extensa de cada partido para obtener este\ndato.\n\nSi requiere una investigación compleja o no puede verificarse con\nconfianza, omítelo.\n\nANÁLISIS PRINCIPAL\n\n1.  RESULTADO RECIENTE\n\nIncluye:\n\n-   partidos;\n-   victorias;\n-   derrotas;\n-   porcentaje de victorias;\n-   racha actual.\n\n2.  CARRERAS\n\nIncluye:\n\n-   carreras anotadas;\n-   carreras permitidas;\n-   diferencial;\n-   carreras anotadas por partido;\n-   carreras permitidas por partido.\n\nLas carreras por partido son cálculos derivados de datos reales.\n\nUtiliza el diferencial como contexto para saber si el récord reciente\nestá acompañado por un rendimiento de carreras razonablemente\nconsistente.\n\nNo afirmes causalidad.\n\n3.  OFENSIVA\n\nUtiliza únicamente:\n\n-   carreras por partido;\n-   OPS del período, si está disponible de forma confiable;\n-   LOB ofensivo total y LOB por partido, si están disponibles de forma\n    confiable.\n\nLa pregunta es:\n\n“¿La ofensiva está ayudando a explicar el momento?”\n\nNo agregues otras estadísticas ofensivas salvo que sean necesarias para\nexplicar un patrón concreto.\n\n4.  PITCHEO\n\nUtiliza:\n\n-   carreras permitidas por partido;\n-   ERA del período, si está disponible de forma confiable.\n\nLa pregunta es:\n\n“¿El pitcheo está sosteniendo al equipo o dificultando su rendimiento?”\n\nNo agregues FIP, xERA, WHIP u otras métricas avanzadas.\n\n5.  PARTIDOS CERRADOS\n\nDetermina:\n\n-   récord en partidos decididos por una carrera;\n-   derrotas por una carrera;\n-   si una parte importante de las derrotas recientes ocurrió por una o\n    dos carreras;\n-   si las victorias o derrotas recientes han sido generalmente cerradas\n    o amplias.\n\nUtiliza solamente resultados reales.\n\nNO inventes un indicador de “partidos cerrados”.\n\n6.  LOCAL Y VISITANTE\n\nDentro del mismo período:\n\nLOCAL: - partidos; - victorias; - derrotas; - porcentaje de victorias.\n\nVISITANTE: - partidos; - victorias; - derrotas; - porcentaje de\nvictorias.\n\nSi una muestra es pequeña, indícalo y no exageres la diferencia.\n\n7.  SERIES\n\nIdentifica todas las series relevantes dentro del período.\n\nFormato:\n\nRival — ganó X-X Rival — perdió X-X Rival — dividió X-X Rival — serie en\ncurso: X-X\n\nNo enumeres partidos individuales salvo que sea necesario para explicar\nun patrón importante.\n\n8.  DEFENSA\n\nNo fuerces una estadística defensiva.\n\nSolo incluye una señal defensiva si existe evidencia clara y verificable\nque ayude a explicar el momento reciente.\n\nPuede ser:\n\n-   errores;\n-   carreras relacionadas con errores;\n-   jugadas defensivas decisivas;\n-   un patrón defensivo repetido.\n\nSi no existe una señal clara, no incluyas defensa.\n\n9.  JUGADORES\n\nNo analices jugadores individuales salvo que:\n\n-   una lesión;\n-   una ausencia;\n-   una actuación extraordinaria;\n-   o el rendimiento de un jugador\n\nsea claramente necesario para explicar el comportamiento reciente del\nequipo.\n\nNo conviertas la radiografía del equipo en un análisis de jugadores.\n\nINTERPRETACIÓN\n\nDespués de reunir los datos, encuentra una sola historia principal.\n\nPrioriza:\n\n1.  qué está funcionando;\n2.  qué está fallando;\n3.  qué patrón reciente vale la pena recordar.\n\nDistingue siempre:\n\n“Los datos muestran…” = hecho directamente respaldado.\n\n“Esto podría indicar…” = interpretación prudente.\n\nNo afirmes causalidad cuando solo exista coincidencia.\n\nNo conviertas una muestra pequeña en una tendencia definitiva.\n\nLas preguntas internas para encontrar la historia son:\n\n-   ¿El récord está respaldado por el diferencial?\n-   ¿La ofensiva está produciendo suficientes carreras?\n-   ¿El OPS respalda esa lectura?\n-   ¿El pitcheo está permitiendo demasiadas carreras?\n-   ¿El ERA respalda esa lectura?\n-   ¿Está ganando o perdiendo demasiados partidos cerrados?\n-   ¿Hay diferencia entre local y visitante?\n-   ¿Qué rivales o series destacan?\n-   ¿El LOB ofensivo muestra una señal relevante?\n-   ¿Hay derrotas en entradas finales que sea útil mencionar?\n-   ¿Existe una señal defensiva verificable?\n-   ¿Cuál de estos elementos explica mejor el momento?\n\nNo respondas estas preguntas una por una. Úsalas para construir la\nhistoria.\n\nFORMATO FINAL\n\nLa respuesta debe ser muy compacta y apta para celular.\n\nUsa exactamente esta estructura:\n\nEQUIPO\n\nEQUIPO: [nombre] PERÍODO: últimos 30 días | actualizado al [fecha]\nPARTIDOS: [número]\n\nFOTO RÁPIDA\n\nMedida | Resultado Récord | [G-P] Racha | [racha] Carreras | [anotadas –\npermitidas] Diferencial | [+/−] Carreras por partido | [dato] OPS |\n[dato, si es confiable] ERA | [dato, si es confiable] LOB ofensivo |\n[total, si es confiable] LOB por partido | [dato calculado, si es\nconfiable] 1 carrera | [G-P] Local | [G-P] Visitante | [G-P]\n\nIncluye solo las filas cuyos datos hayan sido verificados.\n\nNo elimines una categoría porque la búsqueda sea incómoda. Primero\nintenta verificarla.\n\nSi después de verificarla no existe información confiable para el\nperíodo, omítela.\n\nSERIES RECIENTES\n\nRival — resultado de la serie Rival — resultado de la serie Rival —\nresultado de la serie\n\nIncluye todas las series relevantes dentro del período.\n\n¿QUÉ ESTÁ PASANDO?\n\nMáximo 3 puntos.\n\n1.  Qué está funcionando.\n2.  Qué está fallando.\n3.  Qué patrón reciente vale la pena recordar.\n\nIntegra aquí, cuando corresponda:\n\n-   ofensiva;\n-   pitcheo;\n-   LOB;\n-   partidos cerrados;\n-   derrotas en entradas finales;\n-   local/visitante;\n-   rivales;\n-   defensa.\n\nNo crees subsecciones adicionales.\n\nEN UNA FRASE\n\nUna sola frase, fácil de recordar, basada en los datos, sin predicciones\nni exageraciones.\n\nFUENTES\n\nMenciona únicamente las fuentes realmente utilizadas.\n\nESTADÍSTICAS PROHIBIDAS SALVO PETICIÓN EXPLÍCITA\n\nNo utilices:\n\n-   WAR;\n-   wRC+;\n-   FIP;\n-   xERA;\n-   WPA;\n-   Clutch;\n-   ni otras métricas avanzadas.\n\nCONTROL FINAL\n\nAntes de responder, comprueba:\n\nPERÍODO - ¿Son realmente los últimos 30 días? - ¿La fecha de corte está\nindicada? - ¿El último partido está finalizado? - ¿Los partidos en curso\nestán excluidos?\n\nRÉCORD - ¿Partidos = victorias + derrotas? - ¿La racha corresponde al\núltimo partido finalizado?\n\nCARRERAS - ¿Anotadas correctas? - ¿Permitidas correctas? - ¿Diferencial\ncorrecto? - ¿Carreras por partido correctamente calculadas?\n\nOFENSIVA - ¿OPS corresponde al período? - ¿LOB corresponde al LOB\nofensivo del equipo? - ¿LOB total y LOB por partido corresponden al\nmismo período?\n\nPITCHEO - ¿ERA corresponde al período?\n\nPARTIDOS CERRADOS - ¿El récord de una carrera es correcto? - ¿Las\nderrotas por una o dos carreras están respaldadas por resultados reales?\n\nLOCAL/VISITANTE - ¿Los récords corresponden solo al período? - ¿Se evita\nexagerar muestras pequeñas?\n\nSERIES - ¿Cada serie está correctamente identificada? - ¿El resultado\ncoincide con los partidos disputados? - ¿Las series en curso están\nidentificadas como tales?\n\nENTRADAS FINALES - ¿Solo se incluyó información si era verificable\ndirectamente? - ¿Se evitó crear una métrica nueva?\n\nINTERPRETACIÓN - ¿Los hechos están separados de las interpretaciones? -\n¿No se afirmó causalidad sin evidencia? - ¿La historia principal se\npuede entender en una lectura?\n\nPRINCIPIO FINAL\n\nPrimero verifica. Después calcula únicamente lo que pueda calcularse con\ndatos completos. Después selecciona lo relevante. Finalmente explica la\nhistoria.\n\nNo sacrifiques precisión para llenar la tabla. No sacrifiques\ninformación solicitada para ahorrar espacio. La compactación debe\nproducirse en la presentación, no eliminando el análisis.\n\nEl objetivo es recordar tres cosas:\n\n1.  cómo está el equipo;\n2.  por qué parece estar así;\n3.  contra quién le ha ido bien o mal recientemente.\n\nLa radiografía debe sentirse como la explicación breve de un buen\ncomentarista deportivo: números suficientes para entender, no números\nsuficientes para impresionar.",
